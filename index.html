function render(){let content=({home,maternal,baby:babyView,family:familyView,planner:plannerView,ai:aiView,community:communityView,life:lifeView,insights:insightsView}[view]||home)();root.innerHTML=layout(content);document.body.classList.toggle('u-tool-open',Boolean(feature));document.title=(feature?byFeature[feature]?.title:(navs.find(n=>n[0]===view)||navs[0])[1])+' · MomCare';
 if(feature==='return'&&window.MomCareCareer)window.MomCareCareer.mount(document.getElementById('career-center-root'),{mode:'demo',ownerId:db.current,allowed:isMom(),getTasks:()=>db.tasks,addTask:args=>{addTask(args);return db.tasks.at(-1).id;},onChanged:()=>{records=read(RK,[]);}});
 if(!feature&&view==='community')window.MomCareCommunity?.mount(document.getElementById('community-hub-root'),{mode:'demo',userId:db.current,onSummary:()=>openFeature('summary')});}
function go(v){const previous=feature;feature=null;view=v;render();if(previous&&window.MOMCARE_STATIC!==true){const url=new URL(location.href);if(url.searchParams.has('tool')){url.searchParams.delete('tool');history.replaceState(null,'',url.pathname+url.search+url.hash);}}if(previous){root.querySelector?.('[data-feature="'+previous+'"]')?.focus();}else window.scrollTo(0,0)}
function openFeature(id){if(!byFeature[id])return;if(id==='care'||id==='delegation')return go('family');feature=id;view=byFeature[id].group;render();root.querySelector?.('.u-tool-popup-head button')?.focus()}
function dialog(title,html){modal=`<div class="u-modal-backdrop" data-action="close-modal"></div><section class="u-modal" role="dialog" aria-modal="true" aria-label="${e(title)}"><div class="u-modal-head"><h2>${e(title)}</h2><button data-action="close-modal" class="u-modal-x">×</button></div>${html}</section>`;render();}
function closeModal(){modal='';render()}
function newTaskDialog(){dialog('添加家庭照护任务',`<form id="new-task-form"><label class="u-field">任务名称<input name="title" maxlength="80" required placeholder="例如：下午帮忙照顾宝宝"></label><div class="u-form-two"><label class="u-field">任务日期<input type="date" name="task_date" required value="${date()}"></label><label class="u-field">开始时间<input name="start_time" type="time" required value="14:00"></label></div><div class="u-form-two"><label class="u-field">预计时长（分钟）<input name="duration_minutes" type="number" min="5" max="480" value="60" required></label><label class="u-field">任务类别<select name="category">${Object.entries(catNames).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></label></div><button type="submit" class="u-btn primary">保存至家庭任务库</button></form>`)}
function editRest(){dialog('调整妈妈休息时段',`<form id="rest-form"><div class="u-form-two"><label class="u-field">开始时间<input type="time" name="start" value="${db.family.rest_start}" required></label><label class="u-field">结束时间<input type="time" name="end" value="${db.family.rest_end}" required></label></div><p class="u-muted">此设置会参与排班算法。休息区间不可跨越午夜。</p><button type="submit" class="u-btn primary">保存休息保护</button></form>`)}
function editPerson(){const m=person(db.current);dialog('编辑我的照护时间与时间',`<form id="person-form"><p class="u-muted">当前身份：${me()}。声明需自行核验，不代表专业照护资格。</p><div class="u-form-two"><label class="u-field">空闲开始<input name="from" type="time" value="${m.available_from}" required></label><label class="u-field">空闲结束<input name="until" type="time" value="${m.available_until}" required></label></div><label class="u-checkline"><input type="checkbox" name="can_baby_care" ${m.can_baby_care?'checked':''}> 我确认可以承担基本宝宝照护</label><label class="u-checkline"><input type="checkbox" name="can_prepare_meals" ${m.can_prepare_meals?'checked':''}> 我确认可以准备家庭餐食</label><button type="submit" class="u-btn primary">保存个人设置</button></form>`)}
function addBabyLog(){dialog('添加宝宝照护日志',`<form id="baby-form"><div class="u-form-two"><label class="u-field">记录类别<select name="type"><option>喂养</option><option>睡眠</option><option>尿布</option><option>护理</option><option>成长事件</option></select></label><label class="u-field">记录时间<input type="time" name="at" value="${new Date().toTimeString().slice(0,5)}" required></label></div><label class="u-field">简要描述<textarea name="note" class="u-textarea" required maxlength="300"></textarea></label><button type="submit" class="u-btn primary">保存宝宝记录</button></form>`)}
function editGrowth(){dialog('更新宝宝成长数据',`<form id="growth-form"><label class="u-field">日期<input type="date" name="date" value="${date()}" required></label><div class="u-form-two"><label class="u-field">体重（kg）<input name="weight" type="number" min="0.2" max="90" step="0.01" placeholder="例如 6.5"></label><label class="u-field">身长（cm）<input name="height" type="number" min="20" max="200" step="0.1" placeholder="例如 63"></label></div><button type="submit" class="u-btn primary">保存成长记录</button></form>`)}
function helpDialog(){dialog('提出关怀请求',`<form id="help-form"><label class="u-field">需要什么帮助？<select name="kind"><option value="support">希望有人陪伴或协助</option><option value="baby">需要家人照看宝宝</option><option value="meal">需要有人准备餐食</option><option value="housework">需要分担家务</option></select></label><label class="u-field">具体需求<textarea name="title" class="u-textarea" required maxlength="160" placeholder="例如：下午两点希望能安心休息"></textarea></label><div class="u-form-two"><label class="u-field">希望开始时间<input type="time" name="start" value="14:00" required></label><label class="u-field">预计时长（分钟）<input type="number" name="duration" min="5" max="480" value="60" required></label></div><button type="submit" class="u-btn primary">保存为待安排任务</button></form>`)}
function addTask({title,category='admin',task_date=date(),start_time='14:00',duration_minutes=60}){if(!title.trim())throw Error('请填写任务名称');if(!/^\d{4}-\d{2}-\d{2}$/.test(task_date))throw Error('日期无效');if(!Number.isFinite(P.minute(start_time))||P.minute(start_time)+Number(duration_minutes)>1440||Number(duration_minutes)<5||Number(duration_minutes)>480)throw Error('时间或任务时长无效');db.tasks.push({id:uid(),title:title.trim().slice(0,80),category,task_date,start_time,duration_minutes:Number(duration_minutes),priority:2,status:'pending',created_by:db.current,assigned_to:null,proposed_to:null,updated_at:new Date().toISOString()});db.plan=null;db.selected=[];save();}
function parseIntent(text){const message=(text||'').trim();if(!message)return null;const day=/明天/.test(message)?(()=>{const d=new Date();d.setDate(d.getDate()+1);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)})():date();let category=/宝宝|看护|陪伴孩子/.test(message)?'baby':/饭|餐|做菜/.test(message)?'meal':/清洁|衣服|洗衣|打扫/.test(message)?'housework':'support';let title=category==='baby'?'帮助照顾宝宝':category==='meal'?'准备家庭餐食':category==='housework'?'分担家庭事务':'陪伴并支持妈妈';const found=message.match(/(?:上午|下午|晚上)?\s*(\d{1,2})\s*(?:点|时)(半)?/);const period=/(下午|晚上)/.exec(message)?.[1];let h=found?Number(found[1]):14;if(period&&h<12)h+=12;const start=String(Math.min(h,23)).padStart(2,'0')+':'+(found?.[2]?'30':'00');let duration=60;const hrs=message.match(/(\d+)\s*(?:个)?小时/);const mins=message.match(/(\d+)\s*分钟/);if(hrs)duration=Number(hrs[1])*60;else if(mins)duration=Number(mins[1]);duration=Math.max(5,Math.min(240,duration));return {title,category,day,start,duration,note:'根据文字关键词生成的本地草稿，请手动校对任务类别和时间。'};}
function handleAction(button){const act=button.dataset.action,id=button.dataset.id,t=db.tasks.find(x=>x.id===id);if(act==='ai-history'){window.MomCareAI.history({mode:'demo',kind:button.dataset.kind||feature});return;}if(act==='chat-ai-archive'){const prompt=document.querySelector('#chat-form [name=prompt]')?.value.trim();if(!prompt)return toast('请先输入关怀问题');window.MomCareAI.submit('ai_chat',{prompt},{mode:'demo',consent:true,ownerId:db.current,files:window.MomCareFiles?.pick(document.querySelector('#chat-form'))}).catch(err=>toast(err.message));return;}if(act==='close-modal'){closeModal();return;}if(act==='old-community')return openFeature('community');if(act==='open-summary')return openFeature('summary');if(act==='go-home')return go('home');if(act==='go-family')return go('family');if(act==='go-planner')return go('planner');if(act==='back-feature')return go(byFeature[feature]?.group||'home');if(act==='feature-recovery')return openFeature('recovery');if(act==='feature-shopping')return openFeature('shopping');if(act==='feature-mood')return openFeature('mood');if(act==='new-task')return newTaskDialog();if(act==='edit-rest')return editRest();if(act==='edit-person')return editPerson();if(act==='add-baby-log')return addBabyLog();if(act==='edit-growth')return editGrowth();if(act==='open-help')return helpDialog();if(act==='reset'){if(confirm('确认重置所有本地演示记录吗？')){localStorage.removeItem(TK);localStorage.removeItem(RK);localStorage.removeItem(BK);location.reload()}return;}
if(act==='parse-intent'){const text=document.getElementById('intent-text')?.value||'';db.draft=parseIntent(text);if(!db.draft)return toast('请先输入需求描述');save();render();return;}
if(act==='generate-plan'){planDate=document.getElementById('plan-date')?.value||date();db.plan=P.schedule({tasks:db.tasks,members:db.members,overrides:db.overrides||[],family:db.family,day:planDate});db.selected=db.plan.proposals.map(p=>p.task.id);save();render();toast('已生成可审核的调度建议');return;}
if(act==='publish-plan'){if(!db.plan||!db.selected?.length)return toast('没有选择的调度建议');const current=P.schedule({tasks:db.tasks,members:db.members,overrides:db.overrides||[],family:db.family,day:db.plan.day});const newPlan=new Map(current.proposals.map(x=>[x.task.id,x]));if(db.selected.some(id=>!newPlan.has(id)||newPlan.get(id).member.user_id!==db.plan.proposals.find(x=>x.task.id===id)?.member.user_id))return toast('任务条件已变化，请重新生成方案');let count=0;for(const id of db.selected){const p=newPlan.get(id);if(!p)continue;p.task.proposed_to=p.member.user_id;p.task.updated_at=new Date().toISOString();count++;}db.plan=null;db.selected=[];save();go('family');toast('已创建 '+count+' 项模拟邀请，需受邀家人接受');return;}
if(['accept','decline','claim','complete'].includes(act)&&t){if(act==='accept'){if(t.proposed_to!==db.current)return toast('只有受邀人可以接受');const check=P.eligibility(t,person(db.current),{family:db.family,tasks:db.tasks,overrides:db.overrides||[]});if(!check.ok)return toast('无法接受：'+check.reasons[0]);t.assigned_to=db.current;t.proposed_to=null;toast('已接受照护邀请');}if(act==='decline'){if(t.proposed_to!==db.current)return toast('只有受邀人可以拒绝');t.proposed_to=null;toast('已拒绝邀请，任务重新待协调');}if(act==='claim'){if(t.assigned_to||t.proposed_to)return toast('此任务已被安排');const check=P.eligibility(t,person(db.current),{family:db.family,tasks:db.tasks,overrides:db.overrides||[]});if(!check.ok)return toast('无法认领：'+check.reasons[0]);t.assigned_to=db.current;toast('任务已认领');}if(act==='complete'){if(t.assigned_to!==db.current&&t.created_by!==db.current)return toast('没有操作权限');t.status='done';toast('已完成任务');}t.updated_at=new Date().toISOString();db.plan=null;save();render();return;}
if(act==='delete-record'){const r=records.find(x=>x.id===id);if(!r)return;if(r.user_id!==db.current&&!(isMom()&&!r.user_id))return toast('只能删除自己的记录');if(!confirm('确定删除这条记录吗？'))return;records=records.filter(x=>x.id!==id);save();render();toast('已删除');return;}
if(act==='toggle-shopping'){const r=records.find(x=>x.id===id);if(!r||r.kind!=='shopping')return;if(r.user_id!==db.current)return toast('只能修改自己的购物项');r.data.status=r.data.status==='已购买'?'待购买':'已购买';save();render();return;}
if(act==='feature-template'){const form=document.getElementById('feature-form');if(!form)return;const data=Object.fromEntries(new FormData(form));const x=document.getElementById('template-result');x.hidden=false;x.textContent=template(feature,data);return;}
}
async function doSubmit(form){const fd=new FormData(form),data=Object.fromEntries(fd.entries());const id=form.id;
if(id==='feature-form'){const kind=feature,f=byFeature[kind];if(!f)return;if(f.group==='maternal'&&!isMom())return toast('妈妈的私人记录仅本人能添加');if(!Object.values(data).some(x=>String(x).trim()))return toast('请先填写记录内容');for(const [name,,type,a,b] of f.fields){if(type==='number'&&data[name]!==''&&(Number(data[name])<Number(a)||Number(data[name])>Number(b)))return toast('请检查数值范围');}const aiMode=aiWorkflowKinds.has(kind);if(aiMode&&!data.aiConsent)return toast('请先勾选同意发送给 AI 并自动保存');delete data.aiConsent;const visibility=(shareable.has(kind)&&data.shared==='on')?'shared':'private';delete data.shared;const copy={...data};const row={id:uid(),kind,data:copy,user_id:db.current,visibility,created_at:new Date().toISOString()};if(aiMode){try{await window.MomCareAI.submit(kind,copy,{mode:'demo',consent:true,ownerId:db.current,files:window.MomCareFiles?.pick(form)});records.push(row);save();}catch(err){toast(err.message);}return;}try{row.attachments=await window.MomCareFiles?.store(window.MomCareFiles?.pick(form),{mode:'demo',ownerId:db.current,kind,recordId:row.id})||[];}catch(err){toast(err.message);return;}records.push(row);save();render();toast('已保存本地记录与附件');return;}
if(id==='new-task-form'){try{addTask(data);modal='';go('family');toast('已添加待分配任务')}catch(err){toast(err.message)}return;}
if(id==='help-form'){try{addTask({title:data.title,category:data.kind,task_date:date(),start_time:data.start,duration_minutes:Number(data.duration)});modal='';go('family');toast('关怀需求已加入家庭任务')}catch(err){toast(err.message)}return;}
if(id==='draft-form'){try{addTask(data);db.draft=null;save();render();toast('草稿已加入任务库')}catch(err){toast(err.message)}return;}
if(id==='rest-form'){if(P.minute(data.start)>=P.minute(data.end))return toast('休息结束时间必须晚于开始时间');db.family.rest_start=data.start;db.family.rest_end=data.end;db.plan=null;save();modal='';render();toast('已更新休息保护时段');return;}
if(id==='person-form'){if(P.minute(data.from)>=P.minute(data.until))return toast('可用结束时间必须晚于开始时间');const m=person(db.current);m.available_from=data.from;m.available_until=data.until;m.can_baby_care=Boolean(fd.get('can_baby_care'));m.can_prepare_meals=Boolean(fd.get('can_prepare_meals'));db.plan=null;save();modal='';render();toast('已更新个人能力和时间');return;}
if(id==='baby-form'){baby.logs.push({id:uid(),...data});save();modal='';render();toast('已保存护理日志');return;}
if(id==='growth-form'){if(!data.weight&&!data.height)return toast('请至少填写一项数据');if(data.weight)baby.weight.push({date:data.date,value:Number(data.weight)});if(data.height)baby.height.push({date:data.date,value:Number(data.height)});save();modal='';render();toast('成长数据已保存');return;}
if(id==='chat-form'){aiText=String(data.prompt||'').trim();if(!aiText)return;aiResult=/休息|照护|任务|照顾/.test(aiText)?'先确认妈妈希望休息的时间，然后列出需要家人承担的具体任务。进入“智能分配”，根据真实空闲时间与已声明能力生成建议，再由家人自行确认。':'这是一条本地演示模板，不是 DeepSeek 回复。可以进一步明确需求、具体日期与能提供帮助的家人。涉及健康问题请咨询专业医护人员。';render();return;}
}
document.addEventListener('click',event=>{const link=event.target.closest('[data-nav],[data-feature],[data-action]');if(!link||!root.contains(link))return;if(link.tagName==='A')event.preventDefault();if(link.dataset.nav){go(link.dataset.nav);return;}if(link.dataset.feature){openFeature(link.dataset.feature);return;}if(link.dataset.action)handleAction(link);});
document.addEventListener('change',event=>{if(event.target.id==='identity-picker'){db.current=event.target.value;save();render();toast('已切换为'+me()+'的模拟视角');}if(event.target.matches('[data-select-task]')){const id=event.target.dataset.selectTask;db.selected=db.selected||[];db.selected=event.target.checked?[...new Set([...db.selected,id])]:db.selected.filter(x=>x!==id);save();const button=document.querySelector('[data-action="publish-plan"]');if(button){button.disabled=db.selected.length===0;button.innerHTML='发送 '+db.selected.length+' 项模拟邀请';}}});
document.addEventListener('submit',event=>{if(!root.contains(event.target))return;event.preventDefault();void doSubmit(event.target).catch(err=>toast(err.message))});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&feature&&!document.getElementById('mcfiles-overlay'))go(byFeature[feature]?.group||'home');});
mentalUI.attach();
const demoEntry=new URLSearchParams(location.search||'').get('tool')||(location.hash==='#tool-return'?'return':null);if(location.hash==='#tool-return')history.replaceState(null,'',location.pathname+location.search);
if(demoEntry&&byFeature[demoEntry]&&!byFeature[demoEntry].legacy&&demoEntry!=='community')openFeature(demoEntry);else render();
})();

</script><style>
#mc-judge-config{position:fixed;z-index:1000;right:16px;bottom:14px;display:flex;gap:8px;align-items:center;padding:9px 12px;background:#f4f9f4;border:1px solid #d8e8d9;border-radius:14px;color:#415f50;box-shadow:0 6px 20px #273e3020;font-size:12px}
#mc-judge-config button{background:white;border:1px solid #cadcca;border-radius:8px;padding:5px 8px;color:#415f50;font-size:12px}
@media(max-width:650px){#mc-judge-config{left:12px;right:12px;bottom:8px;justify-content:center}}
</style><div id="mc-judge-config" role="note"><strong>真实 DeepSeek AI</strong><span>公开体验 · 无需密码 · 本地数据</span></div>
