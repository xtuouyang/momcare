/* MomCare 竞赛版配置：只填写 Worker 公共地址。切勿在此填写 DeepSeek API Key。 */
window.MOMCARE_STATIC = true;
window.MOMCARE_WORKER_URL = "https://momcare-ai-competition.27894827.workers.dev";
window.MomCareRealAI = {
  async request(row) {
    const endpoint = String(window.MOMCARE_WORKER_URL || '').trim().replace(/\/+$/, '');
    if (!endpoint.startsWith('https://') || endpoint.includes('REPLACE_WITH_YOUR_WORKER')) {
      throw Error('尚未配置 Cloudflare Worker 地址');
    }
    let response;
    try {
      response = await fetch(endpoint + '/api/chat', {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind: row.kind, inputs: row.inputs })
      });
    } catch (e) {
      throw Error('无法连接 AI 服务，请检查 Worker 地址、部署状态与允许来源配置');
    }
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw Error(body.error || ('AI 请求失败，状态码 ' + response.status));
    if (!body.answer || body.source !== 'deepseek') throw Error('AI 返回内容不完整');
    return body.answer;
  }
};

(function (root) {

    const reasons=[];

    if(!date(task.task_date)||!Number.isFinite(start)||!Number.isFinite(end)||end>1440||end<=start)reasons.push('任务时间无效或跨越午夜');

    const override=overrides.find(o=>o.user_id===member.user_id&&o.day===task.task_date);
    if(override?.unavailable)reasons.push('该日期已标记不可用');
    const availStart=override&&!override.unavailable?override.start_time:member.available_from;
    const availEnd=override&&!override.unavailable?override.end_time:member.available_until;
    const from=minute(availStart),to=minute(availEnd);
    if(!Number.isFinite(from)||!Number.isFinite(to))reasons.push('未设置此日期的可用时间');
    else if(Number.isFinite(start)&&(start<from||end>to))reasons.push('任务不在可用时间内');

async function list(options={}){const {mode='demo',ownerId='mom',kind,recordId}=options;let rows;if(mode==='demo'){rows=(await transaction('readonly',s=>s.getAll()))||[];rows=rows.filter(r=>r.ownerId===ownerId);}else{const c=await sessionCtx();rows=await cloudTable(c,'GET','?select=*&order=created_at.desc&limit=500');}if(kind)rows=rows.filter(x=>x.kind===kind);if(recordId)rows=rows.filter(x=>x.recordId===recordId||x.record_id===recordId);return rows.map(({blob,...r})=>r).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));}

let cache=[];async function refreshVault(){const box=document.querySelector('#mcfiles-vault-list');if(!box)return;try{cache=await list(defaultScope());const q=(document.querySelector('#mcfiles-vault-search')?.value||'').toLowerCase();const rows=cache.filter(x=>(x.name+' '+x.kind).toLowerCase().includes(q));box.innerHTML=rows.length?rows.map(x=>`<div class="mcfiles-entry"><div><strong>${es(x.name)}</strong><small>${es(x.kind)} · ${(x.size/1024).toFixed(0)} KB · ${es(new Date(x.created_at).toLocaleDateString('zh-CN'))}</small></div><button data-mcfiles-open="${es(x.id)}">查看</button><button data-mcfiles-delete="${es(x.id)}">删除</button></div>`).join(''):'<p>没有匹配的文件。</p>';}catch(e){box.textContent=e.message;}}

/* Shared structured plan validation and rendering. No arbitrary model output is executed. */
(function(g){'use strict';
const modes=['daily','career','returnwork','learning','balance','goals'];
const names={daily:'日常生活规划',career:'职业发展规划',returnwork:'职场回归计划',learning:'个人能力提升',balance:'生活职业平衡',goals:'我的目标'};
const cut=(v,n=200)=>String(v??'').trim().slice(0,n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function day(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return '';const d=new Date(v+'T00:00:00Z');return Number.isFinite(+d)&&d.toISOString().slice(0,10)===v?v:'';}
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function time(v){return /^([01]\d|2[0-3]):[0-5]\d$/.test(v||'')?v:'';}
function minute(v){return Number(v.slice(0,2))*60+Number(v.slice(3));}
function step(x){if(!x||!cut(x.title,80))throw Error('请填写计划事项');const date=day(x.date),start=time(x.start),minutes=Number(x.minutes);if(!date||!start||!Number.isInteger(minutes)||minutes<5||minutes>480||minute(start)+minutes>1440)throw Error('请检查日期、开始时间与时长（5 至 480 分钟，不跨午夜）');return {title:cut(x.title,80),date,start,minutes,category:['learning','career','personal','rest','family'].includes(x.category)?x.category:'personal',note:cut(x.note,500),done:x.done===true};}

><small>${k}</small><strong>${v}</strong></div>`).join('')}</div><div class="cp-chart" aria-label="最近七天已完成学习计划时长">${s.days.map(d=>`<div><span>${d.minutes} 分钟</span><div class="cp-bar"><i style="height:${d.minutes/max*100}%"></i></div><small>${d.date.slice(5)}</small></div>`).join('')}</div></section><section class="cp-panel"><h3>我的个人日程与目标</h3><p>添加、编辑或勾选完成。需要家人协助时，先查看冲突，再自行确认发布。</p>${stepForm(editing||{})}<div class="cp-search"><input id="cp-filter" placeholder="按目标、日期或关键字查询" value="${esc(query)}"><button class="cp-btn secondary" type="button" data-cp="filter">查询</button></div>${visible.length?visible.map(r=>{const conflicts=items.filter(o=>o.id!==r.id&&!o.done&&overlap(o,r));const familyConf=tasks.filter(t=>t.status!=='done'&&t.task_date===r.date&&t.start_time&&P.minute(String(t.start_time).slice(0,5))<P.minute(r.start)+r.minutes&&P.minute(r.start)<P.minute(String(t.start_time).slice(0,5))+Number(t.duration_minutes));return `<article class="cp-entry"><div><strong>${esc(r.title)}</strong><p>${esc(r.date)} · ${esc(r.start)} · ${r.minutes} 分钟 · ${categories[r.category]||''} · ${r.done?'已完成':'待完成'}</p><p>${esc(r.note)}</p>${conflicts.length?'<p class="cp-warn">有 '+conflicts.length+' 项个人计划时间重叠，请调整。</p>':''}${familyConf.length?'<p class="cp-warn">同时段有 '+familyConf.length+' 项未完成家庭任务，请在家庭照护核对是否影响你。</p>':''}${r.sharedTaskId?'<p>已关联家庭任务：'+esc(tasks.find(t=>t.id===r.sharedTaskId)?.status==='done'?'已完成':'请在家庭照护查看进度')+'</p>':''}</div><div class="cp-actions"><button type="button" data-cp="done" data-id="${esc(r.id)}">${r.done?'取消完成':'标记完成'}</button><button type="button" data-cp="edit" data-id="${esc(r.id)}">编辑</button>${!r.sharedTaskId&&!r.done?`<button type="button" data-cp="share" data-id="${esc(r.id)}">请求家人协助</button>`:''}<button type="button" data-cp="delete" data-id="${esc(r.id)}">删除</button></div>${share===r.id?`<form id="cp-share-form" data-id="${esc(r.id)}" class="cp-form"><p>不会共享你的个人规划、简历和 AI 回复。请填写一条具体的家庭任务。</p><label class="cp-field">可共享任务名称<input name="title" maxlength="80" required placeholder="例如：请协助看护宝宝"></label><label class="cp-field">任务类别<select name="category"><option value="baby">宝宝照护</option><option value="meal">餐食准备</option><option value="housework">家务</option><option value="support">妈妈关怀</option><option value="admin">组织安排</option></select></label><button class="cp-btn" type="submit">确认并创建待认领任务</button></form>`:''}</article>`}).join(''):'<p>暂无个人计划。可以手动添加，或从 AI 结果导入。</p>'}</section></div>`;g.MomCareFiles?.decorate(root);}
root.addEventListener('click',e=>{const b=e.target.closest('button[data-cp],button[data-cp-mode]');if(!b||!root.contains(b))return;e.preventDefault();e.stopPropagation();if(locked)return;if(b.dataset.cpMode){mode=b.dataset.cpMode;editing=null;paint();return;}const r=items.find(x=>x.id===b.dataset.id);switch(b.dataset.cp){case'history':g.MomCareAI.history({mode:ctx.mode,kind:'return'});break;case'old':history=!history;paint();break;case'refresh':busy(load);break;case'filter':query=root.querySelector('#cp-filter').value;paint();break;case'edit':editing=r;paint();root.querySelector('#cp-step-form')?.scrollIntoView({block:'nearest'});break;case'share':share=share===r?.id?null:r?.id;paint();break;case'done':if(r)busy(async()=>{await put(ctx,{...r,done:!r.done},r.id);await load();});break;case'delete':if(r&&confirm('删除私人计划？已创建的家庭任务不会随之删除。'))busy(async()=>{await del(ctx,r.id);await load();});break;}});
root.addEventListener('submit',e=>{const f=e.target;if(!['career-form','cp-step-form','cp-share-form'].includes(f.id))return;e.preventDefault();e.stopPropagation();if(locked||!f.reportValidity())return;busy(async()=>{const d=Object.fromEntries(new FormData(f));if(f.id==='career-form'){delete d.consent;for(const [k,v] of Object.entries(d))if(typeof v!=='string')delete d[k];if(!String(d.goal||'').trim())throw Error('请填写本次目标');if(!P.day(d.date)||!P.time(d.plan_start)||P.minute(d.plan_start)+Number(d.plan_minutes)>1440)throw Error('计划时间不能跨午夜');if(d.resource_type!=='不查询'&&!d.resource_keyword?.trim())throw Error('请填写公开资源关键词');d.plan_mode=mode;await g.MomCareAI.submit('return',d,{mode:ctx.mode,consent:true,familyId:ctx.familyId,userId:ctx.userId,ownerId:ctx.ownerId,files:g.MomCareFiles?.pick(f)});return;}if(f.id==='cp-step-form'){const prior=items.find(r=>r.id===d.planId),s=P.step({...d,done:prior?.done});if(prior?.sharedTaskId&&(s.date!==prior.date||s.start!==prior.start||s.minutes!==prior.minutes))throw Error('该计划已有关联家庭任务，请先在家庭照护协调时间；可另建个人计划。');if(items.some(r=>r.id!==d.planId&&!r.done&&overlap(r,s))&&!confirm('与其他计划时间重叠，仍要保存吗？'))return;await put(ctx,{...prior,...s,planType:'step',module:prior?.module||mode},prior?.id);editing=null;await load();return;}const r=items.find(x=>x.id===f.dataset.id);if(!r)throw Error('未找到计划');if(await publish(ctx,f,r)){share=null;await load();status('已创建待认领任务，请进入家庭照护或智能分配查看。');}});});
load().catch(e=>{root.innerHTML='<p class="cp-notice">'+esc(e.message)+'</p>';});}
g.MomCareCareer={mount,importStep,importAll,rows,overlap};

</script><script>
/* MomCare AI submission workflow. Demo data is browser-local; cloud rows use owner-only RLS. */
(function(global){'use strict';
const TARGETS={
 recovery:'AI 妈妈身心关怀助手',mental:'AI 妈妈心理状态测评',mood:'妈妈情绪关怀',nutrition:'妈妈营养规划师',feeding:'喂养准备与支持',visit:'AI 妈妈就诊助手',return:'生活与职业发展',parent_ai:'AI 育儿顾问',baby_food:'AI 辅食规划',storybook:'AI 小故事',summary:'社区 AI 摘要',shopping:'智能商品推荐',ai_chat:'AI 关怀助手'
};
const NAMES={plan_mode:'规划模块',plan_start:'计划开始时间',plan_minutes:'每日可支配分钟',resource_type:'资源类型',resource_keyword:'公开资源关键词',resource_region:'查询地区',education:'学历与专业',experience:'经验与已有技能',industry:'目标行业或技能',city:'所在地',salary:'期望薪资',work_style:'工作方式',career_focus:'规划重点',work_status:'工作状态',return_date:'返岗日期',interests:'个人兴趣',routine:'固定时间安排',family_support:'家庭支持',skills:'技能基础',metric:'完成标准',deadline:'目标截止日期',date:'记录日期',sleep:'睡眠时长',energy:'今日精力',note:'其他说明',mood:'今日心情',support:'需要的支持',preferences:'饮食偏好',ingredients:'已有食材',avoid:'需要避开的食材',method:'喂养方式',challenge:'遇到的困难',facility:'医疗机构',questions:'就诊问题',goal:'规划目标',status:'准备状态',age:'宝宝月龄',question:'育儿问题',prompt:'关怀问题',context:'主动分享的家庭任务摘要',hero:'故事主角',theme:'故事主题',value:'想传递的启发',topic:'讨论主题',discussion:'讨论内容',item:'想购买的商品',category:'用品类别',quantity:'数量',target:'使用对象',budget:'总预算（人民币元）',brands:'品牌偏好',requirements:'必须满足的规格、功能与场景',stage:'当前阶段',dimensions:'四维感受摘要',version:'问卷版本'};
const KEY='momcare_ai_workflow_demo_v1', SESSION='momcare_cloud_session_v2';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>global.crypto?.randomUUID?.()||'demo'+Date.now()+Math.random().toString(36).slice(2);
const mode=()=>new URLSearchParams(location.search).get('mode')==='cloud'?'cloud':'demo';
const read=()=>{try{const out=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(out)?out:[]}catch{return []}};
const write=rows=>{localStorage.setItem(KEY,JSON.stringify(rows))};
function demoOwner(){try{const o=JSON.parse(localStorage.getItem('momcare_phase3_demo_v2')||'{}');return o.current||'mom'}catch{return 'mom'}}
function session(){try{return JSON.parse(sessionStorage.getItem(SESSION)||'null')}catch{return null}}
let cfg=null;
async function config(){if(!cfg){const res=await fetch('/api/config',{cache:'no-store'});if(!res.ok)throw Error('无法获取网站配置');cfg=await res.json();}if(!cfg?.url||!cfg?.publishableKey)throw Error('Supabase 尚未配置');return cfg;}
async function cloud(table,method='GET',query={},data){const c=await config(),s=session();if(!s?.access_token)throw Error('登录状态已过期，请返回首页重新登录');const u=new URL(c.url+'/rest/v1/'+table);Object.entries(query).forEach(([k,v])=>u.searchParams.set(k,String(v)));const headers={apikey:c.publishableKey,Authorization:'Bearer '+s.access_token,Accept:'application/json'};if(data!==undefined){headers['Content-Type']='application/json';headers.Prefer='return=representation';}const r=await fetch(u,{method,headers,body:data===undefined?undefined:JSON.stringify(data),cache:'no-store'});const t=await r.text();let j;try{j=t?JSON.parse(t):null}catch{j=null}if(!r.ok)throw Error(j?.message||j?.error||`数据保存失败（${r.status}），请检查 SQL 升级脚本与权限`);return j;}
function inputSanitize(kind,data){if(!Object.hasOwn(TARGETS,kind))throw Error('此模块保留原有功能，不走 AI 提交流程');if(!data||typeof data!=='object'||Array.isArray(data))throw Error('请填写内容');if(kind==='mental'){const stage=String(data.stage||''),dimensions=data.dimensions;if(!/^(preconception|other|pregnancy_early|pregnancy_mid|pregnancy_late|postpartum_early|postpartum_later|postpartum_long)$/.test(stage)||!dimensions||['mood','worry','rest','support'].some(k=>typeof dimensions[k]!=='number'||!Number.isFinite(dimensions[k])||dimensions[k]<0||dimensions[k]>3))throw Error('请先完成心理感受自评');return {stage,dimensions:{mood:dimensions.mood,worry:dimensions.worry,rest:dimensions.rest,support:dimensions.support},version:'self_reflection_v1'};}
 const out={};for(const [k,v] of Object.entries(data)){if(['shared','visibility','aiConsent','consent','safe','flags','urgent'].includes(k))continue;if(typeof v!=='string'&&typeof v!=='number')continue;const s=String(v).trim().slice(0,1500);if(s)out[k]=s;}
 if(kind==='shopping'&&!out.item)throw Error('请先填写想购买的商品或用品');if(!Object.keys(out).length)throw Error('请先填写问题或记录内容');if(JSON.stringify(out).length>4400)throw Error('内容较长，请精简至约 2000 字以内');return out;
}
function safeText(){return '如果目前有伤害自己或宝宝的想法，或出现明显混乱、幻觉等精神状态异常，请立即联系当地急救服务或前往急诊，并请可信任的人陪同。日本可拨 119，中国大陆可拨 120，美国可拨 911。不要等待 AI 回复。若安全情况不确定，也建议尽快寻求专业人员的帮助。';}
function shoppingDemo(input){const item=String(input.item||'待填写用品'),spec=String(input.requirements||input.note||'按实际使用场景选择'),exclusion=String(input.avoid||'尚未填写'),brands=String(input.brands||'不限'),budget=input.budget!==undefined&&input.budget!==''?`总预算 ${input.budget} 元`:'未指定预算',qty=Number(input.quantity)>0?Number(input.quantity):1;const type=/学饮杯|水杯|吸管杯/.test(item)?'可拆洗防漏学饮杯（需核对适用年龄及饮水方式）':/纸尿裤|尿不湿|尿布/.test(item)?'符合体重及腰围规格的纸尿裤（先核对包装尺码）':/围兜|口水巾/.test(item)?'易拆洗围兜（核对固定方式、尺寸与材质）':/哺乳|吸奶/.test(item)?'按实际喂养需求选择适配的哺乳用品（涉及医疗或特殊需求请咨询专业人员）':item+'（按要求筛选的候选规格）';return `你的购买需求：${item}\n${budget}；数量 ${qty}；品牌偏好 ${brands}。\n使用对象：${input.target||'未指定'}；阶段：${input.stage||'未说明'}；月龄：${input.age||'未填写'}。\n\n候选商品类型：${type}\n必须核对：${spec}\n排除条件：${exclusion}\n${input.budget&&Number(input.budget)>=0?'按数量计算的单件预算上限：'+(Number(input.budget)/qty).toFixed(2)+' 元（预算计算，不是商品价格）。\n':''}搜索关键词：${item} ${input.brands||''}\n\n这是离线需求示例，没有实际商品查询能力。登录云端并接入 DeepSeek 后才能生成品牌和型号候选；不要将示例当作真实商品、价格、库存或安全认证。`;}
function localAnswer(kind,input){const lead='以下为离线演示模板，并非 DeepSeek 或任何 AI 的真实回复。\n\n';switch(kind){case 'mental':return lead+'这份摘要只能帮助整理自己的感受，不能用于诊断或排除孕产期心理健康问题。可以向信任的人提出休息、陪伴、家务分担的具体请求。如果困扰持续、加重或明显影响日常生活，请咨询产科或心理健康专业人员。';case 'mood':return lead+'你记录的心情值得被认真对待。可以尝试明确一种今天希望家人提供的帮助，例如分担宝宝照护、陪同散步或留出安静休息时间。持续困扰时寻求专业支持。';case 'ai_chat':return lead+'谢谢你愿意表达自己的照护需要。可以先说明最急需得到的具体帮助，并邀请能够承担任务的家人共同讨论。请记住，AI 不会实际替你执行安排。';case 'storybook':return lead+`《森林里的小约定》\n\n很久以前，有个叫${input.hero||'小星星'}的小伙伴，走进一座花园。它看到一只小兔子正为找不到回家的路而发愁。小星星决定陪它沿着小溪寻找熟悉的树。\n\n天黑之前，它们终于找到了兔子的家。小兔子说：“谢谢你愿意陪我。”小星星笑了，它明白：帮助朋友也能收获快乐。\n\n这是本地的小故事示例，实际故事由 AI 根据主题和篇幅生成。`;case 'summary':return lead+'一、不同家庭的经验观点需分别记录。\n二、对存在争议的做法保留差异。\n三、健康相关说法需查证权威来源，不将用户经验当作医学证据。';case 'shopping':return lead+shoppingDemo(input);case 'baby_food':return lead+'根据宝宝发育准备情况及专业建议考虑适龄辅食，留意已知过敏信息和卫生安全。此处不生成医学个性化饮食处方。';case 'visit':return lead+'就诊前可准备：主要问题出现的时间、症状变化、想向医生确认的事项及既往检查记录。严重或突然出现的症状应及时就医。';default:return lead+'可以先梳理当前最需要解决的事情，再与家庭成员讨论可行的支持安排和休息时间。对于医学相关问题，应向合格医护人员咨询。AI 建议不会自动安排家庭任务或代替实际医疗服务。';}}

function path(which,recMode,context){if(window.MOMCARE_STATIC===true)return '#ai-'+which+(context?'/'+encodeURIComponent(context):'');return '/ai-workspace?mode='+recMode+(context?'&'+(which==='history'?'kind':'id')+'='+encodeURIComponent(context):'');}
async function submit(kind,data,options={}){const m=options.mode==='cloud'?'cloud':'demo';if(!options.consent&&!options.safety)throw Error('请勾选同意提交 AI，并自动保存本次输入和回复');const input=inputSanitize(kind,data),r=createRow(kind,input,{mode:m,safety:Boolean(options.safety),ownerId:options.ownerId||demoOwner()});

function history(options={}){const m=options.mode==='cloud'?'cloud':'demo',kind=String(options.kind||'');if(!Object.hasOwn(TARGETS,kind))throw Error('请从具体的 AI 功能页面打开该功能自己的历史记录');navigateWorkspace(path('history',m,kind));}
let activePage='history',activeId='',activeKind='',all=[],currentlyRunning=new Set(),query='';
function shell(content){return `<div class="mcai-shell"><aside class="mcai-side"><div class="mcai-logo">♡ <strong>MomCare</strong></div><span class="mcai-side-caption">AI CARE ARCHIVE</span><button type="button" data-ai-nav="history">本功能历史记录</button><button type="button" data-ai-nav="return">返回 MomCare</button><p>私人记录仅本人可见。体验模式保存在浏览器中，请勿填写真实敏感医疗信息。</p></aside><main class="mcai-main"><header class="mcai-header"><span>MomCare / AI 结果与记录</span><span class="mcai-mode">${mode()==='cloud'?'家庭云端':'本地体验'}</span></header>${content}</main></div>`;}
const stamp=s=>{try{return new Date(s).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return String(s)}};
const summary=x=>x.kind==='mental'?`阶段：${x.inputs.stage}；四维摘要：${Object.values(x.inputs.dimensions||{}).join(' / ')}`:Object.entries(x.inputs||{}).map(([k,v])=>`${NAMES[k]||k}：${v}`).join(' · ');
const filesMarkup=r=>r.attachments?.length?`<section class="mcai-card"><h2>本次上传的文件和图片（${r.attachments.length}）</h2><p class="mcai-hint">默认私人保存，仅本次明确授权的附件会交给 DeepSeek 处理。点击可查看图片或下载文档。</p><div class="mcai-filebox">${r.attachments.map(f=>`<div class="mcai-fileitem"><span>${esc(f.name)} <small>(${Math.round(f.size/1024)} KB)</small></span><button type="button" data-ai-file="${esc(f.id)}">查看附件</button></div>`).join('')}</div></section>`:'';
const badge=r=>r.status==='complete'?r.source==='deepseek'?'DeepSeek 已回复':r.source==='safety'?'安全提示':'本地模板':r.status==='failed'?'生成失败':'生成中';
function webResult(answer){try{const d=JSON.parse(answer);if(d?.kind!=='shopping_web'||d.version!==1||!Array.isArray(d.products))return null;return {...d,products:d.products.slice(0,5)};}catch{return null;}}
function safeLink(v){try{const u=new URL(v);return u.protocol==='https:'&&!u.username&&!u.password&&u.hostname.includes('.')&&!/^(?:localhost|\d+[.]\d+[.]\d+[.]\d+)$|\.(?:local|internal|localhost)$/i.test(u.hostname)?u.href:'';}catch{return '';}}
const money=v=>typeof v==='number'&&Number.isFinite(v)&&v>0?'¥'+v.toFixed(2):'待核价';
let shoppingOrder='match';
function webShoppingMarkup(d){const arr=d.products.map((p,i)=>({...p,index:i}));if(shoppingOrder==='price')arr.sort((a,b)=>(a.price??Infinity)-(b.price??Infinity));const demo=d.demo===true;return `<div class="mcai-shopping-results"><div class="mcai-web-intro"><strong>${demo?'离线界面示例 · 非真实商品':'DeepSeek 已联网检索商品'}</strong><p>${esc(d.needs)}</p><small>${demo?'本地演示，无联网查询及真实价格':`查询时间：${esc(stamp(d.searchedAt))}　·　${esc(d.query)}`}</small></div><div class="mcai-shop-toolbar"><h3>本次推荐 ${arr.length} 款（最多5款）</h3><label>排序 <select id="mcai-shop-order"><option value="match" ${shoppingOrder==='match'?'selected':''}>需求与预算匹配</option><option value="price" ${shoppingOrder==='price'?'selected':''}>参考价格从低到高</option></select></label></div>${arr.length?`<div class="mcai-shop-grid">${arr.map(p=>{const url=safeLink(p.sourceUrl),image=safeLink(p.imageUrl),merchant=url&&/^(item\.jd\.com|item\.taobao\.com|detail\.tmall\.com|mobile\.yangkeduo\.com)$/.test(new URL(url).hostname);return `<article class="mcai-product mcai-web-product"><div class="mcai-product-image" data-product-image-index="${p.index}">${image?`<img src="${esc(image)}" alt="${esc(p.name)} 商品来源图片" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('来源图片暂时无法显示'))">`:'<span>暂无可核实商品图片</span>'}</div><div class="mcai-product-content"><div class="mcai-shop-tag">${esc(p.budgetStatus||'待核实')}</div><h4>${esc(p.name)}</h4><div class="mcai-product-price">${money(p.price)} <small>${p.price!=null?'搜索页面参考单价':'来源未给出明确单价'}</small></div>${p.total!=null?`<p>按填写数量估算：${money(p.total)}（不含运费）</p>`:''}<p><strong>规格：</strong>${esc(p.spec)}</p><p><strong>匹配理由：</strong>${esc(p.reason)}</p><p><strong>购买前核实：</strong>${esc(p.verify)}</p>${p.priceEvidence?`<p class="mcai-price-evidence">价格原文：${esc(p.priceEvidence)}</p>`:''}<p class="mcai-source">来源：${esc(p.site|| (demo?'演示':'网页'))}${p.sourceTitle?' · '+esc(p.sourceTitle):''}</p><div class="mcai-actions">${url?`<a class="mcai-btn secondary mcai-shop-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${demo?'查看示例来源':'查看商品页面'}</a>`:''}<button type="button" class="mcai-btn" data-ai-act="add-product" data-index="${p.index}">加入需求清单</button></div></div></article>`;}).join('')}</div>`:'<div class="mcai-empty">没有找到符合要求且具有可核对来源的商品。请调整关键词、预算或规格后重试。</div>'}${d.searchUrl&&safeLink(d.searchUrl)?`<p class="mcai-hint">未找到合适的商品？<a href="${esc(safeLink(d.searchUrl))}" target="_blank" rel="noopener noreferrer" style="text-decoration:underline;color:#37604f">去京东搜索同类商品</a>（这是搜索页，不是某件商品的购买链接）。</p>`:''}${d.overBudget?`<p class="mcai-hint">已排除 ${Number(d.overBudget)||0} 项按网页标价估算超过总预算的候选。</p>`:''}<h3>综合比较与购买建议</h3><p>${esc(d.conclusion)}</p><p class="mcai-hint">${esc(d.notice)}</p></div>`;}
function shoppingCopy(answer){const d=webResult(answer);if(!d)return answer;return [d.needs,...d.products.map(p=>[p.name,money(p.price),p.spec,p.reason,p.verify,p.sourceUrl].filter(Boolean).join('\n')),d.conclusion,d.notice].join('\n\n');}
function demoWebResult(input){const name=String(input.item||'商品'),q=Number(input.quantity)||1;return JSON.stringify({version:1,kind:'shopping_web',demo:true,needs:name+'；'+(input.budget?'总预算 '+input.budget+' 元；':'')+'数量 '+q+'；'+(input.requirements||'按用途选择')+'；排除 '+(input.avoid||'无') ,products:[{name:name+' · 候选规格示例',spec:input.requirements||'核对实际规格与适龄说明',reason:'仅展示推荐结果界面，不是实际商品',verify:input.avoid||'核对商品详情',price:null,total:null,budgetStatus:'离线演示，未核价',site:'演示数据'}],conclusion:'登录云端后将从网页来源筛选真实候选商品。',notice:'此示例不包含真实商品、价格、图片或购买链接。'});}
async function addProduct(row,index){const d=webResult(row.answer),p=d?.products[index];if(!p)throw Error('商品记录不存在');const multi=/[、，,；;\n]|以及/.test(row.inputs?.item||'');const qty=multi?1:Math.min(99,Math.max(1,Math.floor(Number(row.inputs?.quantity)||1)));const key=row.id+':'+index;const payload={item:String(p.name).slice(0,170),category:row.inputs?.category||'其他',quantity:String(qty),status:'待购买',requirements:String(p.spec||'').slice(0,300),note:[p.price!=null?'搜索页面参考单价 '+money(p.price):'实际价格待核实',safeLink(p.sourceUrl),p.verify].filter(Boolean).join('；').slice(0,1800),recommendation_key:key,source_url:safeLink(p.sourceUrl),reference_price:p.price??null,queried_at:d.searchedAt||null};
 if(mode()==='demo'){const k='momcare_phase4_demo_v1';let rows;try{rows=JSON.parse(localStorage.getItem(k)||'[]');}catch{rows=[];}if(!Array.isArray(rows))rows=[];if(rows.some(r=>r.user_id===demoOwner()&&r.data?.recommendation_key===key))return '已在需求清单中';rows.push({id:id(),kind:'shopping',data:payload,user_id:demoOwner(),visibility:'private',created_at:new Date().toISOString()});localStorage.setItem(k,JSON.stringify(rows));return '已加入需求清单';}
 const uid=session()?.user?.id;if(!uid||!row.family_id)throw Error('请返回首页确认登录与家庭信息');const existing=await cloud('feature_records','GET',{select:'id',family_id:'eq.'+row.family_id,user_id:'eq.'+uid,kind:'eq.shopping','payload->>recommendation_key':'eq.'+key,limit:'1'});if(existing?.length)return '已在需求清单中';await cloud('feature_records','POST',{}, {family_id:row.family_id,user_id:uid,kind:'shopping',visibility:'private',payload});return '已加入需求清单';}
function shoppingReply(answer){const web=webResult(answer);if(web)return webShoppingMarkup(web);const chunks=String(answer||'').split('\n\n'),head=chunks.indexOf('候选商品（AI 生成，未实时核验）');if(head<0)return `<div class="mcai-reply">${esc(answer||'暂无回复')}</div>`;return `<div class="mcai-shopping-results">${chunks.map((part,i)=>{if(part==='本次需求'||part==='购买建议'||i===head)return `<h3>${esc(part)}</h3>`;if(/^\d+\. /.test(part)){const [name,...details]=part.split('\n');return `<article class="mcai-product"><h4>${esc(name)}</h4>${details.map(line=>{const sep=line.indexOf('：');return sep<0?`<p>${esc(line)}</p>`:`<p><strong>${esc(line.slice(0,sep))}</strong> ${esc(line.slice(sep+1))}</p>`;}).join('')}</article>`;}return `<p>${esc(part)}</p>`;}).join('')}</div>`;}
function resultView(row){if(!row)return shell(`<h1>未找到这条记录</h1><p>可能已删除，或当前账号没有查看权限。</p><button data-ai-nav="return" class="mcai-btn">返回功能</button>`);return shell(`<div class="mcai-kicker">YOUR AI CARE RESULT</div><h1>${esc(TARGETS[row.kind]||row.title)}</h1><p class="mcai-lead">提交后自动建立记录；完成后保存 AI 回复，随时可以返回查看。</p><div class="mcai-actions"><span class="mcai-state">${esc(badge(row))}</span><button type="button" data-ai-nav="history" class="mcai-btn secondary">查看本功能历史</button><button type="button" data-ai-nav="return" class="mcai-btn secondary">返回功能页面</button></div><section class="mcai-card"><h2>本次提交的内容</h2><div class="mcai-kv">${row.kind==='mental'?`<p>自评仅提交孕产阶段与四项维度摘要，不包含逐题作答或安全关注答案。</p>`:''}${Object.entries(row.inputs||{}).map(([key,val])=>`<div class="mcai-kvrow"><span>${esc(NAMES[key]||key)}</span><strong>${esc(typeof val==='object'?JSON.stringify(val):val)}</strong></div>`).join('')}</div></section>${filesMarkup(row)}<section class="mcai-card mcai-answer" aria-live="polite"><div class="mcai-answerhead"><div><span class="mcai-kicker">AI REPLY</span><h2>${row.kind==='shopping'?'商品推荐结果':'回复结果'}</h2></div>${row.status==='complete'?`<button type="button" data-ai-act="copy" class="mcai-btn secondary">复制回复</button>`:''}</div>${row.status==='pending'?'<div class="mcai-loading"><span class="mcai-spinner"></span> 正在生成回复，请勿关闭页面……</div>':row.status==='failed'?`<p class="mcai-error">${esc(row.error||'AI 暂时不可用，已保留提交记录。')}</p><button class="mcai-btn" data-ai-act="retry">重新生成</button>`:(row.kind==='shopping'?shoppingReply(row.answer):row.kind==='return'&&window.MomCareCareerPlan?.parse(row.answer)?window.MomCareCareerPlan.markup(window.MomCareCareerPlan.parse(row.answer)):`<div class="mcai-reply">${esc(row.answer||'暂无回复')}</div>`)}<p class="mcai-hint">${row.source==='local_demo'?'这是本地模板，不是 AI 的真实回答。':row.kind==='shopping'?'网页候选仅供筛选；实际售价、库存、适龄、规格和认证以商家与权威资料为准。缺少明确来源的数据不展示。历史旧版记录可能仅为模型建议。':row.source==='safety'?'出现安全关注时，优先展示紧急帮助指引，不调用普通 AI 服务。':'生成内容是辅助信息，不代表医学诊断、专业治疗或真实任务已经执行。'}</p></section><p class="mcai-foot">保存时间：${esc(stamp(row.created_at))} · 默认私人记录 · 可以在历史页删除</p>`);}
function historyView(){const kind=activeKind;if(!Object.hasOwn(TARGETS,kind))return shell('<h1>请选择一个 AI 功能</h1><p>请从对应功能页面查看专属历史记录。</p><button data-ai-nav="return" class="mcai-btn">返回网站</button>');const rows=all.filter(x=>x.kind===kind&&(!query||[x.title,x.answer,JSON.stringify(x.inputs),...(x.attachments||[]).map(f=>f.name)].join(' ').toLowerCase().includes(query.toLowerCase()))).slice().sort((a,b)=>b.created_at.localeCompare(a.created_at));return shell(`<div class="mcai-kicker">CARE MEMORY</div><h1>${esc(TARGETS[kind])} · AI 历史记录</h1><p class="mcai-lead">此处只显示本功能的提交内容、AI 回复及附件。旧记录继续保留，可搜索、查看详情或删除。</p><div class="mcai-filters"><input id="mcai-search" type="search" placeholder="搜索提问或回复内容" value="${esc(query)}"/><button class="mcai-btn secondary" data-ai-act="search">查询记录</button></div><div class="mcai-count">本功能共找到 ${rows.length} 条记录</div><div class="mcai-history">${rows.length?rows.map(r=>`<article class="mcai-row"><div class="mcai-rowcontent"><span class="mcai-kicker">${esc(stamp(r.created_at))} · ${esc(badge(r))}</span><h3>${esc(TARGETS[r.kind])}</h3><p>${esc(summary(r).slice(0,210))}</p><small>${esc((r.kind==='shopping'?shoppingCopy(r.answer||'等待生成'):(r.answer||'等待生成')).slice(0,100))}${r.attachments?.length?' · '+r.attachments.length+' 个附件':''}</small></div><div class="mcai-rowactions"><button class="mcai-btn" data-ai-act="detail" data-id="${esc(r.id)}">查看详情</button><button class="mcai-btn danger" data-ai-act="delete" data-id="${esc(r.id)}">删除</button></div></article>`).join(''):'<div class="mcai-empty">此功能暂无 AI 记录。完成一次提交后，会自动保存到此处。</div>'}</div>`);}
function paint(){const node=document.getElementById('ai-workspace-root');if(!node)return;const row=all.find(r=>r.id===activeId);node.innerHTML=activePage==='result'?resultView(row):historyView();if(activePage==='result'&&row?.status==='pending'&&!currentlyRunning.has(activeId))void runAI(row);}
async function list(){if(mode()==='demo'){all=read().filter(r=>(r.owner_id||'mom')===demoOwner());return;}all=[];let offset=0;const pageSize=200;while(true){const chunk=await cloud('ai_submissions','GET',{select:'id,family_id,kind,inputs,attachments,title,answer,status,source,error,created_at,updated_at',order:'created_at.desc',limit:String(pageSize),offset:String(offset)});all.push(...chunk);if(chunk.length<pageSize)break;offset+=pageSize;}}
async function update(row,patch){if(mode()==='demo'){const arr=read(),i=arr.findIndex(x=>x.id===row.id);if(i<0)throw Error('记录不存在');arr[i]={...arr[i],...patch,updated_at:new Date().toISOString()};write(arr);}else{await cloud('ai_submissions','PATCH',{id:'eq.'+row.id},patch);}Object.assign(row,patch);}
async function runAI(row){currentlyRunning.add(row.id);paint();try{let answer,source;if(mode()==='demo'){answer=await window.MomCareRealAI.request(row);source='deepseek';}else{const token=session()?.access_token;if(!token)throw Error('登录已失效');let body=row.kind==='mental'?{consent:true,stage:row.inputs.stage,dimensions:row.inputs.dimensions}:{kind:row.kind,consent:true,message:Object.entries(row.inputs).map(([k,v])=>`${NAMES[k]||k}：${String(v)}`).join('\n')};if(row.kind==='return')body.planning={mode:row.inputs.plan_mode,date:row.inputs.date,start:row.inputs.plan_start,minutes:Number(row.inputs.plan_minutes),search:{type:row.inputs.resource_type,keyword:row.inputs.resource_keyword,region:row.inputs.resource_region}};let route=row.kind==='mental'?'/api/ai/mental':'/api/ai/feature';if(row.attachments?.length){body={...body,kind:row.kind,attachments:await window.MomCareFiles.asAI(row.attachments,{mode:'cloud',userId:session()?.user?.id})};route='/api/ai/attachments';}const response=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});const r=await response.json();if(!response.ok)throw Error(r.error||'AI 暂时无法生成回复');answer=r.answer;source='deepseek';}await update(row,{status:'complete',answer,source,error:null});}catch(err){await update(row,{status:'failed',error:String(err.message||'请求失败').slice(0,220)}).catch(()=>{});}finally{currentlyRunning.delete(row.id);paint();}}
async function remove(id){if(!confirm('删除这条 AI 提交和回复记录？此操作不可撤销。'))return;const row=all.find(x=>x.id===id);if(mode()==='demo')write(read().filter(x=>x.id!==id));else await cloud('ai_submissions','DELETE',{id:'eq.'+id});for(const meta of row?.attachments||[]){await window.MomCareFiles?.remove(meta,{mode:mode(),userId:session()?.user?.id}).catch(()=>{});} await list();paint();}
function selectPage(){
 const h=location.hash,r=h.match(/^#ai-(result|history)(?:\/([^/?#]+))?$/);
 if(window.MOMCARE_STATIC===true&&r){
   const page=r[1],arg=decodeURIComponent(r[2]||'');
   if(page==='history'&&!Object.hasOwn(TARGETS,arg)){
     document.getElementById('ai-workspace-root')?.setAttribute('hidden','');
     document.getElementById('unified-root')?.removeAttribute('hidden');
     return false;
   }
   const prevKind=activeKind;
   activePage=page;activeId=page==='result'?arg:'';activeKind=page==='history'?arg:'';
   if(page==='history'&&prevKind!==activeKind)query='';
   document.getElementById('unified-root')?.setAttribute('hidden','');
   document.getElementById('ai-workspace-root')?.removeAttribute('hidden');
   return true;
 }
 if(window.MOMCARE_STATIC===true){
   document.getElementById('ai-workspace-root')?.setAttribute('hidden','');
   document.getElementById('unified-root')?.removeAttribute('hidden');
   return false;
 }
 if(!['/ai-workspace','/ai-workspace.html'].includes(location.pathname))return false;
 const p=new URLSearchParams(location.search);
 activePage=p.has('id')?'result':'history';activeId=p.get('id')||'';activeKind=p.get('kind')||'';
 return true;
}
async function init(){if(!selectPage())return;const node=document.getElementById('ai-workspace-root');if(!node)return;node.innerHTML='<div class="mcai-loadingpage">正在读取 AI 记录……</div>';try{await list();paint();}catch(e){node.innerHTML=shell(`<h1>无法读取历史记录</h1><p class="mcai-error">${esc(e.message)}</p><p>请先返回 MomCare 登录，并确认已经执行数据库升级脚本。</p><button class="mcai-btn" data-ai-nav="return">返回网站</button>`);}}
function backUrl(){
 const row=all.find(r=>r.id===activeId),kind=activePage==='history'?activeKind:row?.kind;
 if(window.MOMCARE_STATIC===true)
   return kind&&kind!=='ai_chat'&&Object.hasOwn(TARGETS,kind)?
     location.pathname+'?tool='+encodeURIComponent(kind):location.pathname;
 if(mode()!=='cloud')return '/unified-demo'+(kind&&kind!=='ai_chat'?'?tool='+encodeURIComponent(kind):'');
 if(kind==='ai_chat')return '/?section=ai';
 if(kind&&Object.hasOwn(TARGETS,kind)){
   const group=['parent_ai','baby_food','storybook'].includes(kind)?'baby':kind==='summary'?'community':kind==='shopping'?'life':'mama';
   return '/?section='+group+'&tool='+encodeURIComponent(kind);
 }
 return '/';
}
function bind(){document.addEventListener('change',evt=>{if(evt.target.id==='mcai-shop-order'){shoppingOrder=evt.target.value==='price'?'price':'match';paint();}});document.addEventListener('click',async evt=>{const b=evt.target.closest('[data-ai-nav],[data-ai-act],[data-ai-file]');if(!b)return;evt.preventDefault();const nav=b.dataset.aiNav,act=b.dataset.aiAct;try{if(nav==='return'){location.assign(backUrl());return;}if(nav==='history'){const kind=activePage==='history'?activeKind:all.find(r=>r.id===activeId)?.kind;if(!Object.hasOwn(TARGETS,kind))throw Error('请选择具体的 AI 功能');location.assign(path('history',mode(),kind));return;}if(act==='detail'){location.assign(path('result',mode(),b.dataset.id));return;}if(act==='search'){query=document.getElementById('mcai-search')?.value.trim()||'';paint();return;}if(act==='retry'){const row=all.find(r=>r.id===activeId);if(row){await update(row,{status:'pending',error:null});paint();}return;}if(act==='delete'){await remove(b.dataset.id);return;}if(b.dataset.aiFile){const r=all.find(x=>x.id===activeId);const meta=r?.attachments?.find(x=>x.id===b.dataset.aiFile);if(meta)await window.MomCareFiles.inspect(meta,{mode:mode(),userId:session()?.user?.id});return;}if(act==='open-career-plan'){location.assign(window.MOMCARE_STATIC===true?location.pathname+'?tool=return':backUrl());return;}

 function urgentMarkup(){return `<div class="mc-mental-alert"><strong>请优先寻求现场专业帮助</strong><p>如果现在存在伤害自己、宝宝或他人的危险，或出现明显混乱、幻觉等情况，请立即联系当地急救服务或前往急诊，并请信任的人陪同，不要独自承担照护。日本可拨 119，中国大陆可拨 120，美国可拨 911。在线测评与 AI 建议不能处理紧急危机。</p></div>`;}

function localGet(){try{const x=JSON.parse(localStorage.getItem(VERSION)||'null');return x&&Array.isArray(x.posts)?{...blank(),...x}:blank();}catch{return blank();}}

class Hub {
 constructor(root,options){this.root=root;this.options=options;this.mode=options.mode||'demo';this.model=this.mode==='demo'?localGet():blank();if(this.model.panel==='report')this.model.panel='feed';if(this.model.tab==='关注动态')this.model.tab='我的关注';if(this.model.composer){this.model.panel='compose';this.model.composer=false;}this.posts=[];this.comments=[];this.reports=[];this.cloudHidden=new Set();this.reportId=null;this.reportedPostId=null;this.reportError='';this.initialized=false;this.busy=false;this.error='';this.notice='';this.socialError='';this.followings=[];this.notifications=[];this.userId=options.userId||'local';this.pollTimer=null;this.lastInteraction=0;this.setup();}
 setup(){for(const event of ['pointerdown','keydown','focusin','input'])this.root.addEventListener(event,()=>{this.lastInteraction=Date.now();},true);this.root.addEventListener('click',e=>this.onClick(e));this.root.addEventListener('submit',e=>this.onSubmit(e));this.root.addEventListener('change',e=>this.onChange(e));this.root.addEventListener('input',e=>this.onInput(e));this.refresh();if(this.mode==='cloud'&&typeof setInterval==='function')this.pollTimer=setInterval(()=>{if(this.root.isConnected&&document.visibilityState!=='hidden'&&!this.busy&&!['compose','report'].includes(this.model.panel)&&!this.root.querySelector('#ch-reply')&&!this.root.contains(document.activeElement))this.refresh(true);},30000);}
 destroy(){if(this.pollTimer&&typeof clearInterval==='function')clearInterval(this.pollTimer);}
 async api(table,{method='GET',query={},body}={}){
  const auth=this.options.auth?.();if(!auth?.url||!auth?.key||!auth?.token)throw Error('请从 MomCare 登录后再操作互助社区');
  const u=new URL(auth.url.replace(/\/$/,'')+'/rest/v1/'+table);
  for(const [k,v] of Object.entries(query))u.searchParams.set(k,String(v));
  const headers={'apikey':auth.key,Authorization:'Bearer '+auth.token,Accept:'application/json'};
  if(body!==undefined){headers['Content-Type']='application/json';headers.Prefer='return=representation';}
  const r=await fetch(u,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
  const raw=await r.text();let result;try{result=raw?JSON.parse(raw):[];}catch{result=[];}
  if(!r.ok)throw Error(result?.message||result?.error||'云端请求失败：'+r.status);
  return result;
 }
 async refresh(background=false){
  if(!this.root.isConnected)return;
  if(this.mode==='demo'){this.posts=[...seeds,...this.model.posts];this.comments=[...this.model.comments];this.followings=this.model.follows.filter(f=>f.follower_id===this.userId);this.notifications=this.model.notifications.filter(n=>n.recipient_id===this.userId).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));this.initialized=true;this.render();return;}
  try{
   const uid=this.options.userId||this.options.auth?.().userId;
   if(!uid)throw Error('请先登录');this.userId=uid;
   const [feed,mine]=await Promise.all([
    this.api('community_posts',{query:{select:'*',scope:'eq.community',status:'eq.approved',order:'created_at.desc',limit:100}}),
    this.api('community_posts',{query:{select:'*',author_id:'eq.'+uid,order:'created_at.desc',limit:100}})
   ]);
   this.posts=[...new Map([...feed,...mine].map(p=>[p.id,p])).values()];
   const ids=this.posts.filter(p=>/^[0-9a-f-]{36}$/i.test(p.id)).map(p=>p.id);
   this.comments=ids.length?await this.api('community_comments',{query:{select:'*',post_id:'in.('+ids.join(',')+')',order:'created_at.asc',limit:300}}):[];
   this.error='';
   try{const [hidden,reports]=await Promise.all([this.api('community_hidden_posts',{query:{select:'post_id',user_id:'eq.'+uid}}),this.api('community_reports',{query:{select:'*',reporter_id:'eq.'+uid,order:'created_at.desc'}})]);this.cloudHidden=new Set(hidden.map(h=>h.post_id));this.reports=reports;}catch(e){this.cloudHidden=new Set(this.hiddenLocal);this.reports=[];this.error='隐藏与举报云端设置未完成，请执行 community_moderation_upgrade.sql。';}
   try{const [follows,notifications]=await Promise.all([this.api('community_follows',{query:{select:'following_id',follower_id:'eq.'+uid,limit:500}}),this.api('community_notifications',{query:{select:'*',recipient_id:'eq.'+uid,order:'created_at.desc',limit:100}})]);this.followings=follows;this.notifications=notifications;this.socialError='';}
   catch(e){this.followings=[];this.notifications=[];this.socialError='关注与通知尚未配置：请执行 supabase/community_social_upgrade.sql。';}
  }catch(e){this.error='尚不能读取云端社区：'+e.message+'。请先执行 supabase/community_upgrade.sql。';this.posts=[];this.comments=[];}
  this.initialized=true;if(!background||(Date.now()-this.lastInteraction>30000&&!this.root.contains(document.activeElement)&&!['compose','report'].includes(this.model.panel)&&!this.root.querySelector('#ch-reply')))this.render();
 }
 save(){if(this.mode==='demo')localSet(this.model);}
 announce(message,err=false){this.notice=message;this.error=err?message:'';this.render();}
 get mine(){return this.posts.filter(p=>p.author_id===this.userId&&!p.is_example);}
 get followedIds(){return new Set(this.followings.map(f=>f.following_id));}
 get unread(){return this.notifications.filter(n=>!n.is_read).length;}
 canFollow(p){return !!p&&!p.anonymous&&p.author_id!==this.userId&&p.status==='approved'&&p.scope==='community';}
 authorName(id){const p=this.posts.find(p=>p.author_id===id&&!p.anonymous&&p.status==='approved');return p?.alias||'社区成员';}
 followButton(p){if(!this.canFollow(p))return '';const yes=this.followedIds.has(p.author_id);return `<button type="button" class="ch-follow ${yes?'is-following':''}" data-ch="follow" data-id="${escape(p.author_id)}" aria-label="${yes?'取消关注':'关注'}${escape(p.alias||'作者')}">${yes?'已关注 ✓':'＋ 关注用户'}</button>`;}

 get hiddenLocal(){return this.model.hiddenByUser?.[this.userId]||[];}
 get hiddenIds(){return this.mode==='cloud'?this.cloudHidden:new Set(this.hiddenLocal);}
 get ownReports(){return this.mode==='cloud'?this.reports:this.model.reports.filter(r=>r.reporter_id===this.userId);}
 get visible(){const m=this.model;const ids=this.hiddenIds;
  let rows=this.posts.filter(p=>!ids.has(p.id) && (p.status==='approved' || p.author_id===this.userId));
  if(m.tab==='我的帖子')rows=rows.filter(p=>p.author_id===this.userId&&!p.is_example);
  else if(m.tab==='收藏')rows=rows.filter(p=>m.bookmarks.includes(p.id));
  else if(m.tab==='精选')rows=rows.filter(p=>p.status==='approved');
  else if(m.tab==='我的关注')rows=rows.filter(p=>!p.anonymous&&this.followedIds.has(p.author_id)&&p.status==='approved'&&(m.followingAuthor==='all'||p.author_id===m.followingAuthor));
  if(m.category!=='全部话题')rows=rows.filter(p=>p.category===m.category);
  if(m.stage!=='全部阶段')rows=rows.filter(p=>p.stage===m.stage);
  if(m.search)rows=rows.filter(p=>[p.title,p.content,p.alias,p.category].join(' ').toLowerCase().includes(m.search.toLowerCase()));
  return rows.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
 }

 }

 reportView(){const p=this.posts.find(x=>x.id===this.reportedPostId);const prior=this.ownReports.find(r=>r.post_id===this.reportedPostId);return `<div class="ch-writing-page"><div class="ch-writing-nav"><button type="button" class="ch-outline" data-ch="back-feed">返回社区</button><button type="button" class="ch-outline" data-ch="report-history">我的举报</button></div><header class="ch-writing-hero"><div><span class="ch-eyebrow">COMMUNITY SAFETY</span><h2>举报帖子</h2><p>帮助我们维护安全、友善的交流空间。AI 仅提供初审建议，最终违规处理由人工审核。</p></div></header><div class="ch-writing-grid"><section class="ch-card"><h3>举报信息</h3>${this.reportError?`<p class="ch-alert">${escape(this.reportError)}</p>`:''}${prior?this.reportResult(prior):p?`<form id="ch-report" class="ch-composer"><label>举报原因<select name="reason" required><option value="">请选择</option>${['隐私泄露','骚扰或人身攻击','虚假或危险医疗信息','广告或垃圾内容','不适宜或恶意内容','其他'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>补充说明（选填）<textarea name="details" maxlength="500" rows="5" placeholder="说明哪里存在问题，请勿填写电话、病历、身份信息等隐私内容。"></textarea></label><label class="ch-check"><input type="checkbox" name="consent" required> 同意将被举报帖子的公开文字以及举报原因发送给 AI 进行辅助初审。</label><div class="ch-writing-disclaimer">举报和隐藏是独立操作。举报不自动隐藏或删除帖子，AI 初审也不会直接处罚用户。</div><div class="ch-form-actions"><button type="submit" class="ch-primary">提交举报给 AI</button></div></form>`:'<p>该帖子已不可访问。</p>'}</section><aside class="ch-card"><span class="ch-kicker">REPORTED POST</span><h3>${escape(p?.title||'原帖不可查看')}</h3><p class="ch-body">${escape(p?.content||'')}</p><p class="ch-small">仅提交公开内容，不附带作者账号、昵称、附件或举报人的身份。</p></aside></div></div>`;}
 reportResult(r){const status={pending:'已受理，等待 AI 初审',failed:'已受理，AI 暂不可用',reviewed:'AI 初审完成，等待人工复核',demo:'本地模拟初审（非真实 AI）'}[r.ai_status]||'已记录，等待人工复核';return `<div class="ch-report-result"><h3>${status}</h3><p>举报原因：${escape(r.reason)}</p>${r.details?`<p>${escape(r.details)}</p>`:''}${r.ai_result?`<p class="ch-body">${escape(r.ai_result)}</p>`:''}<p class="ch-small">AI 结果仅为辅助建议，不代表平台最终处理决定。</p>${['pending','failed'].includes(r.ai_status)&&this.mode==='cloud'?`<button type="button" class="ch-primary" data-ch="retry-report" data-id="${escape(r.id)}">重试 AI 初审</button>`:''}</div>`;}

 syncPreview(){const f=this.root.querySelector?.('#ch-compose');if(!f)return;const get=n=>f.elements.namedItem(n);const val=n=>String(get(n)?.value||'').trim();const anonymous=Boolean(get('anonymous')?.checked);const alias=anonymous?'匿名成员':(val('alias')||'社区成员');const title=val('title')||'你的标题会显示在这里';const content=val('content')||'正文预览会随着输入实时更新。';const set=(id,value)=>{const el=this.root.querySelector(id);if(el)el.textContent=value;};set('#ch-preview-alias',alias);set('#ch-preview-avatar',anonymous?'匿':alias.slice(0,1));set('#ch-preview-title',title);set('#ch-preview-body',content);set('#ch-preview-topic',val('category'));set('#ch-preview-stage',val('stage'));set('#ch-content-count',String(get('content')?.value?.length||0)+' / 2000 字');}

 details(p){const comments=this.comments.filter(c=>c.post_id===p.id&&['approved','pending'].includes(c.status)&& (c.status==='approved'||c.author_id===this.userId));return `<div class="ch-card ch-detail"><div class="ch-section-head"><h3>讨论详情</h3><button type="button" data-ch="close-detail">返回帖子列表</button></div><div class="ch-tags">${this.badgeRow(p)}</div><h2>${escape(p.title)}</h2><p class="ch-body">${escape(p.content)}</p><div class="ch-detail-meta"><span class="ch-small">作者：${p.anonymous?'匿名成员':escape(p.alias||'社区成员')} · ${when(p.created_at)}</span>${this.followButton(p)}</div><div class="ch-post-foot">${this.postActions(p)}</div><div class="ch-divider"></div><div class="ch-section-head"><h3>交流回复</h3><span>${comments.length} 条可见记录</span></div>${comments.map(c=>`<div class="ch-comment"><strong>${c.anonymous?'匿名成员':escape(c.alias||'成员')}</strong>${c.status==='pending'?'<span class="ch-tag">待审核</span>':''}<small>${when(c.created_at)}</small><p>${escape(c.content)}</p></div>`).join('')||'<p class="ch-small">还没有交流回复，欢迎表达关心和经验。</p>'}${p.status==='approved'?`<form id="ch-reply" data-post-id="${escape(p.id)}"><label>留下回复<textarea name="content" minlength="3" maxlength="800" required rows="3" placeholder="尊重不同选择，分享亲身经历，避免给出未经核验的诊疗建议。"></textarea></label><label class="ch-check"><input name="anonymous" type="checkbox" checked> 匿名显示</label><button class="ch-primary" type="submit">${this.mode==='demo'?'保存演示回复':'提交回复审核'}</button></form>`:'<p class="ch-small">该帖子暂未通过审核，因此无法公开回复。</p>'}</div>`;}
 profileView(id){const rows=this.posts.filter(p=>p.author_id===id&&!p.anonymous&&p.status==='approved'&&p.scope==='community'&&!this.hiddenIds.has(p.id));if(!rows.length)return '<div class="ch-empty">此用户暂时没有可以公开查看的署名帖子。</div>';return `<div class="ch-card"><div class="ch-section-head"><h3>${escape(this.authorName(id))} 的公开主页</h3><button type="button" data-ch="back-feed">返回社区</button></div><p class="ch-small">只能关注公开署名的作者。匿名帖子不显示在个人主页，也不会推送给关注者。</p><div class="ch-follow-panel">${this.followButton(rows[0])}</div></div>${rows.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(p=>this.postCard(p)).join('')}`;}
 notificationsView(){const m=this.model;const selected=this.notifications.filter(n=>m.notificationFilter==='全部消息'||!n.is_read);return `<div class="ch-card ch-notices"><div class="ch-section-head"><h3>站内消息通知 ${this.unread?`<span class="ch-unread-badge">${this.unread}</span>`:''}</h3><button type="button" data-ch="back-feed">返回讨论广场</button></div><p class="ch-small">关注用户的新帖子、别人关注你和自己帖子的公开回复会在这里提醒。云端模式每 30 秒检查一次；也可手动刷新。</p><div class="ch-notice-toolbar"><div class="ch-tabs">${['全部消息','未读'].map(x=>`<button type="button" data-ch="notice-filter" data-value="${x}" class="${m.notificationFilter===x?'active':''}">${x}</button>`).join('')}</div><div class="ch-form-actions"><button type="button" class="ch-outline" data-ch="refresh-alerts">刷新消息</button><button type="button" class="ch-outline" data-ch="read-all" ${this.unread?'':'disabled'}>全部标为已读</button></div></div>${selected.map(n=>`<article class="ch-alert-item ${n.is_read?'':'ch-alert-unread'}"><span class="ch-alert-mark">${n.kind==='follow'?'♡':n.kind==='reply'?'✉':n.kind==='post'?'✎':'✓'}</span><div class="ch-alert-text"><strong>${escape(n.title)}</strong><p>${escape(n.message)}</p><small>${when(n.created_at)} ${n.is_read?'· 已读':'· 未读'}</small></div><div class="ch-alert-actions"><button type="button" class="ch-outline" data-ch="open-notification" data-id="${escape(n.id)}">${n.post_id?'查看帖子':n.is_read?'已读':'标记已读'}</button></div></article>`).join('')||'<div class="ch-empty">目前没有这类消息。关注公开作者并参与交流后，相关通知会显示在这里。</div>'}</div>`;}
 followingView(posts){const ids=[...this.followedIds];return `<section class="ch-following-workspace"><div class="ch-following-header"><div><span class="ch-kicker">PEOPLE & THEIR STORIES</span><h3>我的关注</h3><p>关注的人和他们分享的最新帖子，集中在这里查看，不需要来回切换。</p></div><span class="ch-follow-count">已关注 ${ids.length} 位</span></div>
 <div class="ch-following-directory"><div class="ch-section-head"><h3>关注的伙伴</h3><span>点击头像筛选对应作者的动态</span></div><div class="ch-following-cards"><button type="button" class="ch-person-card ch-person-all ${this.model.followingAuthor==='all'?'selected':''}" data-ch="following-author" data-value="all"><span class="ch-author-avatar">全</span><strong>全部动态</strong><small>${ids.length} 位伙伴</small></button>${ids.map(id=>`<div class="ch-person-card ${this.model.followingAuthor===id?'selected':''}"><button type="button" class="ch-person-choice" data-ch="following-author" data-value="${escape(id)}"><span class="ch-author-avatar">${escape(this.authorName(id).charAt(0))}</span><strong>${escape(this.authorName(id))}</strong><small>查看新分享</small></button><button type="button" class="ch-person-unfollow" data-ch="follow" data-id="${escape(id)}">取消关注</button></div>`).join('')}</div>${ids.length?'':'<p class="ch-follow-empty">还没有关注任何人。在公开署名的帖子中点击“关注用户”，这里就会出现 TA 的分享。</p>'}</div>
 <div class="ch-following-feed"><div class="ch-section-head"><h3>${this.model.followingAuthor==='all'?'关注的人最近分享':escape(this.authorName(this.model.followingAuthor))+' 的分享'}</h3><span>${posts.length} 篇</span></div>${posts.map(p=>this.postCard(p)).join('')||'<div class="ch-empty">暂时没有可以查看的公开动态。可以先去讨论广场看看其他分享。</div>'}</div></section>`;}
 feedResults(posts=this.visible){const m=this.model;return `${m.tab==='我的关注'?this.followingView(posts):`<div class="ch-categories">${CATS.map(x=>`<button type="button" class="${m.category===x?'active':''}" data-ch="category" data-value="${x}">${x}</button>`).join('')}</div><div class="ch-section-head"><h3>${m.tab==='精选'?'互助交流精选':m.tab==='最新'?'最新讨论':m.tab}</h3><span>${posts.length} 篇</span></div>${posts.map(p=>this.postCard(p)).join('')||'<div class="ch-empty">暂无符合条件的帖子。可以调整筛选，或者先写下自己的分享。</div>'}`}`; }
 render(){if(!this.root.isConnected)return;const m=this.model;if(m.panel==='report'){this.root.innerHTML=`<div class="ch-hub ch-compose-mode">${this.reportView()}</div>`;return;}if(m.panel==='compose'){this.root.innerHTML=`<div class="ch-hub ch-compose-mode">${this.composeView()}</div>`;this.syncPreview();return;}
 const selected=this.posts.find(p=>p.id===m.active&&!this.hiddenIds.has(p.id));const posts=this.visible;
 const tabs=`<div class="ch-filters"><div class="ch-tabs">${['精选','最新','我的关注','我的帖子','收藏'].map(x=>`<button type="button" class="${m.tab===x?'active':''}" data-ch="tab" data-value="${x}">${x}</button>`).join('')}</div><div class="ch-input-row"><label class="ch-search"><span>⌕</span><input type="search" data-ch-search value="${escape(m.search)}" placeholder="搜索交流话题、关键词"></label><label class="ch-select-label"><select aria-label="按孕产阶段筛选" data-ch-filter="stage">${STAGES.map(x=>`<option ${m.stage===x?'selected':''}>${x}</option>`).join('')}</select></label></div></div>`;
 const feed=`${tabs}<div class="ch-feed-results">${this.feedResults(posts)}</div>`;
 const center=m.panel==='hidden'?this.hiddenView():m.panel==='reports'?this.reportHistory():m.panel==='notifications'?this.notificationsView():m.panel==='profile'&&m.profile?this.profileView(m.profile):selected?this.details(selected):feed;
 this.root.innerHTML=`<div class="ch-hub">${this.intro()}<div class="ch-info"><span>交流经验</span><span>关注伙伴</span><span>站内通知</span><span>隐私优先</span></div>${this.notice?`<p class="ch-message">${escape(this.notice)}</p>`:''}${this.error?`<p class="ch-alert">${escape(this.error)}</p>`:''}${this.socialError?`<p class="ch-alert">${escape(this.socialError)}</p>`:''}<div class="ch-layout"><section class="ch-main">${center}</section><aside class="ch-side"><div class="ch-card"><span class="ch-kicker">COMMUNITY RULES</span><h3>社区公约</h3><p>保护隐私，尊重不同喂养方式。匿名帖子不可关注其作者。支持举报、隐藏和删除自己的帖子。</p><div class="ch-report-links"><button type="button" class="ch-outline" data-ch="hidden-list">已隐藏</button><button type="button" class="ch-outline" data-ch="report-history">我的举报</button></div><p class="ch-small">${this.mode==='demo'?'本地演示：数据只保存在当前浏览器。':'新发布的帖子和回复需要审核；新帖通知在审核通过后才生成。'}</p></div></aside></div></div>`;
 }

 update(){if(this.mode==='demo'){this.posts=[...seeds,...this.model.posts];this.comments=[...this.model.comments];this.followings=this.model.follows.filter(f=>f.follower_id===this.userId);this.notifications=this.model.notifications.filter(n=>n.recipient_id===this.userId).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));}this.save();this.render();}
 async onClick(e){const b=e.target.closest('button[data-ch],a[data-ch]');if(!b||!this.root.contains(b))return;e.preventDefault();const type=b.dataset.ch,id=b.dataset.id;
  if(type==='compose'){this.model.panel='compose';this.model.active=null;this.model.composer=false;this.update();return;}
  if(type==='close-compose'){this.model.panel='feed';this.update();return;}
  if(type==='following-author'){this.model.followingAuthor=b.dataset.value||'all';this.update();return;}
  if(type==='tab'){this.model.tab=b.dataset.value==='关注动态'?'我的关注':b.dataset.value;if(this.model.tab==='我的关注'){this.model.category='全部话题';this.model.stage='全部阶段';this.model.search='';this.model.followingAuthor='all';}this.model.active=null;this.model.panel='feed';this.update();return;}
  if(type==='back-feed'){this.model.panel='feed';this.model.profile=null;this.model.active=null;this.update();return;}
  if(type==='notifications'){this.model.panel='notifications';this.model.active=null;this.update();return;}
  if(type==='profile'){this.model.panel='profile';this.model.profile=id;this.model.active=null;this.update();return;}
  if(type==='notice-filter'){this.model.notificationFilter=b.dataset.value;this.update();return;}
  if(type==='refresh-alerts'){await this.refresh();this.announce('消息已刷新');return;}
  if(type==='follow'){if(id===this.userId){this.announce('不能关注自己',true);return;}const followed=this.followedIds.has(id);try{if(this.mode==='demo'){if(followed)this.model.follows=this.model.follows.filter(f=>!(f.follower_id===this.userId&&f.following_id===id));else {const eligible=this.posts.some(p=>this.canFollow(p)&&p.author_id===id);if(!eligible)throw Error('只能关注有公开署名帖子的用户');this.model.follows.push({follower_id:this.userId,following_id:id});this.model.notifications.push({id:uid(),recipient_id:id,kind:'follow',post_id:null,title:'收到新的关注',message:'一位社区成员关注了你的公开分享',is_read:false,created_at:new Date().toISOString()});}this.update();}else{if(followed)await this.api('community_follows',{method:'DELETE',query:{follower_id:'eq.'+this.userId,following_id:'eq.'+id}});else await this.api('community_follows',{method:'POST',body:{follower_id:this.userId,following_id:id}});await this.refresh();}if(followed&&this.model.followingAuthor===id)this.model.followingAuthor='all';this.announce(followed?'已取消关注':'关注成功！以后可在“我的关注”查看公开新帖');}catch(err){this.announce(err.message,true);}return;}
  if(type==='read-all'){try{if(this.mode==='demo'){this.model.notifications.filter(n=>n.recipient_id===this.userId).forEach(n=>n.is_read=true);this.update();}else{await this.api('community_notifications',{method:'PATCH',query:{recipient_id:'eq.'+this.userId,is_read:'eq.false'},body:{is_read:true}});await this.refresh();}this.announce('消息已全部标为已读');}catch(err){this.announce(err.message,true);}return;}
  if(type==='open-notification'){const n=this.notifications.find(x=>x.id===id);if(!n)return;try{if(!n.is_read){if(this.mode==='demo'){const it=this.model.notifications.find(x=>x.id===id);if(it)it.is_read=true;}else await this.api('community_notifications',{method:'PATCH',query:{id:'eq.'+id,recipient_id:'eq.'+this.userId},body:{is_read:true}});}if(this.mode==='demo')this.update();else await this.refresh();if(n.post_id&&this.posts.find(p=>p.id===n.post_id)&&!this.hiddenIds.has(n.post_id)){this.model.panel='feed';this.model.active=n.post_id;this.update();}else if(n.post_id)this.announce('该帖子尚不可访问，可能尚未通过审核或已被删除');}catch(err){this.announce(err.message,true);}return;}

  if(type==='category'){this.model.category=b.dataset.value;this.update();return;}
  if(type==='open'){if(this.hiddenIds.has(id))return;this.model.active=id;this.update();return;}
  if(type==='close-detail'){this.model.active=null;this.update();return;}
  if(type==='bookmark'){this.model.bookmarks=this.model.bookmarks.includes(id)?this.model.bookmarks.filter(x=>x!==id):[...this.model.bookmarks,id];this.update();return;}
  if(type==='summary'){if(this.options.onSummary)this.options.onSummary();else location.href=this.mode==='demo'?'/phase4-demo?feature=summary':'/phase4?feature=summary';return;}
  if(type==='delete'){if(!confirm('确认删除自己发布的这篇帖子吗？'))return;try{if(this.mode==='demo'){this.model.posts=this.model.posts.filter(x=>x.id!==id);this.model.comments=this.model.comments.filter(x=>x.post_id!==id);this.update();}else{await this.api('community_posts',{method:'DELETE',query:{id:'eq.'+id,author_id:'eq.'+this.userId}});await this.refresh();}this.announce('帖子已删除');}catch(err){this.announce(err.message,true);}return;}
  if(type==='hidden-list'){this.model.panel='hidden';this.model.active=null;this.update();return;}
  if(type==='report-history'){this.model.panel='reports';this.model.active=null;this.update();return;}
  if(type==='hide'||type==='unhide'){const hide=type==='hide';try{if(this.mode==='cloud'){if(hide){this.cloudHidden.add(id);this.model.active=null;this.render();await this.api('community_hidden_posts',{method:'POST',body:{user_id:this.userId,post_id:id}});}else await this.api('community_hidden_posts',{method:'DELETE',query:{user_id:'eq.'+this.userId,post_id:'eq.'+id}});if(!hide)this.cloudHidden.delete(id);}else{const ids=new Set(this.hiddenLocal);if(hide)ids.add(id);else ids.delete(id);this.model.hiddenByUser={...this.model.hiddenByUser,[this.userId]:[...ids]};}if(hide)this.model.active=null;this.update();this.announce(hide?'帖子已从你的界面隐藏，可在“已隐藏”恢复。':'帖子已恢复显示');}catch(err){if(hide)this.cloudHidden.delete(id);this.announce('操作未保存：'+err.message,true);}return;}
  if(type==='report'){const p=this.posts.find(x=>x.id===id);if(!p||p.author_id===this.userId||p.status!=='approved'||p.scope!=='community')return;this.reportedPostId=id;this.reportError='';this.model.panel='report';this.update();return;}
  if(type==='retry-report'){if(this.busy)return;this.busy=true;try{await this.reviewReport(id);}finally{this.busy=false;}return;}

 }
 onInput(e){if(e.target.matches('[data-ch-compose-field]')){this.syncPreview();return;}if(e.target.matches('[data-ch-search]')){this.model.search=e.target.value;this.save();const results=this.root.querySelector('.ch-feed-results');if(results)results.innerHTML=this.feedResults();}}
 onChange(e){if(e.target.matches('[data-ch-compose-field]')){this.syncPreview();return;}const k=e.target.dataset.chFilter;if(k){this.model[k]=e.target.value;this.update();}}
 async onSubmit(e){if(!['ch-compose','ch-reply','ch-report'].includes(e.target.id)||!this.root.contains(e.target))return;e.preventDefault();if(this.busy)return;const f=e.target,fd=new FormData(f);const text=k=>String(fd.get(k)||'').trim();this.busy=true;
 try{
  if(f.id==='ch-report'){
   const p=this.posts.find(x=>x.id===this.reportedPostId);const reason=text('reason'),details=text('details');if(!p||p.author_id===this.userId||p.status!=='approved'||p.scope!=='community'||!reason||!fd.has('consent'))throw Error('请选择举报原因，并同意 AI 处理公开内容。');if(this.ownReports.some(r=>r.post_id===p.id))throw Error('你已经举报过这篇帖子，请查看我的举报。');const entry={id:uid(),post_id:p.id,reporter_id:this.userId,reason:reason.slice(0,120),details:details.slice(0,500)};
   if(this.mode==='demo'){this.model.reports.push({...entry,created_at:new Date().toISOString(),ai_status:'demo',ai_result:'演示流程：已登记举报原因，建议交由人工核实原帖。不代表实际 AI 判断。'});this.update();}else{await this.api('community_reports',{method:'POST',body:entry});await this.refresh();await this.reviewReport(entry.id);}return;
  }
  if(f.id==='ch-compose'){
   const title=text('title'),content=text('content'),intent=e.submitter?.value||'draft';if(title.length<4||content.length<12)throw Error('请填写完整的标题和至少 12 个字的内容');
   const entry={title:title.slice(0,90),content:content.slice(0,2000),alias:fd.has('anonymous')?'匿名成员':(text('alias').slice(0,28)||'社区成员'),anonymous:fd.has('anonymous'),stage:text('stage'),category:text('category'),status:intent==='draft'?'draft':this.mode==='demo'?'approved':'pending',scope:intent==='draft'?'private':'community',author_id:this.userId,id:uid()};
   const chosenFiles=window.MomCareFiles?.pick(f)||[];if(chosenFiles.length)await window.MomCareFiles.store(chosenFiles,{mode:this.mode,ownerId:this.userId,userId:this.userId,kind:'community_post',recordId:entry.id});
   if(this.mode==='demo'){this.model.posts.push({...entry,created_at:new Date().toISOString()});if(!entry.anonymous&&entry.status==='approved')for(const f of this.model.follows.filter(x=>x.following_id===this.userId)){this.model.notifications.push({id:uid(),recipient_id:f.follower_id,kind:'post',post_id:entry.id,title:'关注用户发表了新帖子',message:entry.title,is_read:false,created_at:new Date().toISOString()});}this.model.tab='我的帖子';this.model.panel='feed';this.model.composer=false;this.update();this.announce(intent==='draft'?'草稿已保存在当前浏览器':'帖子已添加到本地演示（并未公开到真实社区）');}
   else {await this.api('community_posts',{method:'POST',body:entry});this.model.tab='我的帖子';this.model.panel='feed';this.model.composer=false;await this.refresh();this.announce(intent==='draft'?'私人草稿已保存':'帖子已提交审核，审核通过后才会出现在社区');}
  }else{
   const content=text('content'),postId=f.dataset.postId;if(content.length<3)throw Error('回复至少需要 3 个字');const entry={post_id:postId,author_id:this.userId,content:content.slice(0,800),alias:'社区成员',anonymous:fd.has('anonymous'),status:this.mode==='demo'?'approved':'pending'};
   if(this.mode==='demo'){this.model.comments.push({...entry,id:uid(),created_at:new Date().toISOString()});const post=this.posts.find(p=>p.id===postId);if(post&&post.author_id!==this.userId&&!post.is_example){this.model.notifications.push({id:uid(),recipient_id:post.author_id,kind:'reply',post_id:postId,title:'你的帖子收到新回复',message:'有人回复了《'+post.title+'》',is_read:false,created_at:new Date().toISOString()});}this.update();this.announce('回复已保存到本地演示');}
   else {await this.api('community_comments',{method:'POST',body:entry});await this.refresh();this.announce('回复已提交审核');}
  }
 }catch(err){if(this.model.panel==='report'){this.reportError=err.message;this.render();}else this.announce(err.message,true);}finally{this.busy=false;}

function plannerView(){const p=db.plan;return `${head('SMART PLANNING','智能照护分配','第三阶段规则调度引擎，检查任务冲突、个人能力、休息保护与同意。',btn('新建任务','new-task'))}<div class="u-note">自然语言提取在此演示中采用本地规则，不调用 DeepSeek；正式云端版保留 DeepSeek 解析接口。</div><div class="u-columns"><section><div class="u-panel u-card-pad">${section('01 · 描述照护需求','系统先生成可编辑任务草稿') }<textarea id="intent-text" class="u-textarea" placeholder="例如：今天下午两点想休息，请家人照看宝宝一个小时。"></textarea><div class="u-actions">${btn('本地解析需求','parse-intent')}${btn('手动添加任务','new-task','line')}</div>${db.draft?`<div class="u-draft"><strong>请核对任务草稿</strong><p>${e(db.draft.note)}</p><form id="draft-form"><label>任务名称<input name="title" required maxlength="80" value="${e(db.draft.title)}"></label><div class="u-form-two"><label>日期<input name="task_date" type="date" required value="${e(db.draft.day)}"></label><label>开始时间<input name="start_time" type="time" required value="${e(db.draft.start)}"></label></div><div class="u-form-two"><label>时长（分钟）<input name="duration_minutes" type="number" min="5" max="480" required value="${e(db.draft.duration)}"></label><label>类别<select name="category">${Object.entries(catNames).map(([k,v])=>`<option value="${k}" ${db.draft.category===k?'selected':''}>${v}</option>`).join('')}</select></label></div><button class="u-btn primary" type="submit">确认加入任务库</button></form></div>`:''}</div></section><aside><div class="u-panel u-card-pad">${section('02 · 家庭成员情况','每人自主填写自己的时间和能力')}${db.members.map(m=>`<div class="u-member"><span class="u-avatar sage">${e(m.display_name[0])}</span><div><strong>${e(m.display_name)}</strong><small>${m.available_from} 至 ${m.available_until}</small></div><span class="u-mini">${m.can_baby_care?'可照护宝宝':'未确认照护'}</span></div>`).join('')}${btn('调整当前成员能力','edit-person','subtle')}</div></aside></div><div class="u-panel u-card-pad u-schedule">${section('03 · 审核智能调度建议','系统只推荐符合条件的人员，未安排任务会明确说明原因。')}<div class="u-actions"><label class="u-inline-label">调度日期 <input id="plan-date" type="date" value="${e(planDate)}"></label>${btn('重新生成方案','generate-plan')}</div>${p?`<div class="u-plan-summary"><span>可安排 ${p.proposals.length} 项</span><span>待人工协调 ${p.unassigned.length} 项</span></div>${p.proposals.map(row=>`<label class="u-proposal"><input type="checkbox" data-select-task="${e(row.task.id)}" ${db.selected?.includes(row.task.id)?'checked':''}><div><strong>${e(row.task.title)} · ${e(row.member.display_name)}</strong><p>${row.task.start_time} · ${row.task.duration_minutes} 分钟</p><small>${e(row.reason)}</small></div></label>`).join('')}${p.unassigned.map(row=>`<div class="u-unscheduled"><strong>${e(row.task.title)} · 待协调</strong><p>${e(row.reason)}</p></div>`).join('')}<div class="u-actions">${btn('发送 '+(db.selected?.length||0)+' 项模拟邀请','publish-plan','primary',db.selected?.length?'':'disabled')}${btn('查看家庭任务','go-family','line')}</div>`:`<div class="u-empty-block">${icon('calendar',37)}<strong>一份安心的照护计划，从这里开始</strong><p>选择日期并生成方案，查看每一项安排的具体原因。</p></div>`}</div>${medicalNote()}`}
function communityView(){return `${head('SHARE WITH CARE','互助社区','分享经验、关注公开作者，及时查看交流回复与站内消息。')}<div id="community-hub-root"></div>`;}

function lifeView(){const rows=visibleRecords('shopping');return `${head('EVERYDAY SUPPORT','母婴生活服务','用真正需要的清单代替反复购买，减轻家庭的组织负担。',btn(icon('plus',16)+' 添加采购','feature-shopping'))}<div class="u-panel u-card-pad">${section('家庭采购清单','支持按需求记录与勾选已购买')}${rows.length?rows.slice().reverse().map(r=>`<div class="u-shopping"><button class="u-buy-check ${r.data.status==='已购买'?'bought':''}" type="button" data-action="toggle-shopping" data-id="${e(r.id)}">${icon('check',15)}</button><div><strong>${e(r.data.item||'未命名物品')}</strong><small>${e(r.data.category||'生活用品')} · 数量 ${e(r.data.quantity||1)}</small></div><span class="u-pill">${e(r.data.status||'待购买')}</span>${btn('删除','delete-record','line',`data-id="${e(r.id)}"`)}</div>`).join(''):'<p class="u-empty">还没有采购物品，点击添加采购开始。</p>'}</div>${section('生活服务工具','智能购物规划与记录')}${cardGrid(['shopping'])}`}
function aiView(){return `${head('AI CARE ASSISTANT','AI 关怀助手','保留第三阶段的 DeepSeek 接口，演示模式只使用明确标注的本地模板。')}<div class="u-columns"><section><div class="u-panel u-card-pad"><div class="u-ai-header"><div class="u-feature-icon sage">${icon('sparkles',26)}</div><div><strong>MomCare AI 关怀</strong><p>本地演示 · 非 DeepSeek 在线回复</p></div></div><div class="u-ai-chat"><div class="u-ai-bubble">你好，我是 MomCare 的演示助手。你可以描述照护需求，了解网站建议的任务协作流程。此处不进行医疗评估，也不发送你的私人健康记录。</div>${aiText?`<div class="u-ai-bubble mine">${e(aiText)}</div><div class="u-ai-bubble"><span class="u-ai-label">本地规则模板 · 非 AI 生成</span>${e(aiResult)}</div>`:''}</div><form id="chat-form"><label>输入照护需求或使用方法<textarea name="prompt" class="u-textarea" placeholder="例如：我想休息两个小时，该如何安排家人分工？" required maxlength="600"></textarea></label><div class="u-actions"><button type="submit" class="u-btn primary">查看本地示例建议</button>${btn('提交 AI 并保存问答','chat-ai-archive','line')}<a href="/" class="u-btn line">打开云端 DeepSeek 关怀</a></div></form></div></section><aside><div class="u-panel u-card-pad"><h3>AI 能做什么？</h3><p class="u-muted">正式云端版可在获得用户主动授权后，使用 DeepSeek 解析自然语言照护任务、生成一般性建议或原创小故事。</p><p class="u-muted">AI 不会自动分配家人、修改任务、发送通知或代替医生诊断。</p>${btn('前往智能分配','go-planner','subtle')}${btn('查看 AI 关怀历史','ai-history','line','data-kind="ai_chat"')}</div></aside></div>${medicalNote()}`}
function insightsView(){const tasksDone=db.tasks.filter(t=>t.status==='done').length;const total=db.tasks.length||1;const loads=db.members.map(m=>({name:m.display_name,minutes:db.tasks.filter(t=>t.assigned_to===m.user_id||t.proposed_to===m.user_id).reduce((sum,t)=>sum+Number(t.duration_minutes||0),0)}));const max=Math.max(60,...loads.map(m=>m.minutes));const counted=groups.map(g=>({name:g.title,count:visibleRecords().filter(r=>byFeature[r.kind]?.group===g.id).length}));const cmax=Math.max(1,...counted.map(g=>g.count));return `${head('CARE INSIGHTS','家庭关怀数据洞察','把投入与需求变得可见，数据用于讨论，不用于评价谁付出得更多。')}<div class="u-stats">${stat('任务完成率',Math.round(tasksDone/total*100)+'%','根据当前演示任务','check','sage')}${stat('关怀记录',visibleRecords().length+' 条','当前视角可访问的内容','heart','peach')}${stat('宝宝照护日志',baby.logs.length+' 条','家人共同补充','baby','lilac')}${stat('可协调成员',db.members.length+' 人','可用时间自行确认','users','butter')}</div><div class="u-columns"><div class="u-panel u-card-pad">${section('成员任务承诺时长','包括已接受与待回应的任务，不代表实际劳动')}${loads.map(m=>`<div class="u-bar-row"><span>${e(m.name)}</span><div class="u-bar-track"><div style="width:${m.minutes/max*100}%"></div></div><strong>${m.minutes} 分</strong></div>`).join('')}</div><div class="u-panel u-card-pad">${section('功能记录分布','私人记录仅计入本人可见的统计')}${counted.map(g=>`<div class="u-bar-row"><span>${e(g.name)}</span><div class="u-bar-track soft"><div style="width:${g.count/cmax*100}%"></div></div><strong>${g.count} 条</strong></div>`).join('')}</div></div>${medicalNote()}`}
function recordCard(r){const f=byFeature[r.kind];const d=r.data||{};const locked=r.kind==='capsule'&&d.unlock&&d.unlock>date();return `<div class="u-record"><div><strong>${e(f?.title||r.kind)} ${r.kind==='shopping'?' · '+e(d.item||''):''}</strong><small>${new Date(r.created_at||Date.now()).toLocaleDateString('zh-CN')} · ${r.visibility==='shared'?'家庭共享演示':'私人记录'}</small><p>${locked?'这份时光胶囊尚未到开启日期，仅在界面上隐藏内容。':e(Object.entries(d).filter(([k,v])=>v&&k!=='date'&&k!=='unlock').map(([k,v])=>String(v)).join(' · ').slice(0,190))}</p></div>${r.user_id===db.current||(!r.user_id&&isMom())?btn('删除','delete-record','line',`data-id="${e(r.id)}"`):''}</div>`}
function featureView(){if(feature==='return'&&window.MomCareCareer)return '<div id="career-center-root"></div>';const f=byFeature[feature];if(!f)return home();if(feature==='mental')return `<button class="u-back" type="button" data-action="back-feature">${icon('arrow',15)} 返回妈妈关怀</button>${head('MENTAL WELLBEING','AI 妈妈心理状态测评','把关心留给妈妈自己。先观察感受，再决定是否需要支持。')}${btn('查看心理测评 AI 历史','ai-history','line','data-kind="mental"')}${mentalUI.render()}`;const rows=visibleRecords(feature).slice().reverse();const restricted=f.group==='maternal'&&!isMom();return `<button class="u-back" type="button" data-action="back-feature">${icon('arrow',15)} 返回${e(groupsById[f.group]?.title||'总览')}</button>${head('FEATURE DETAILS',e(f.title),e(f.detail))}<div class="u-columns u-feature-columns"><section><div class="u-panel u-card-pad"><div class="u-feature-title"><span class="u-feature-icon ${f.tone}">${e(f.icon)}</span><div><h2>${feature==='shopping'?'添加新的需求清单':'添加新的关怀记录'}</h2><p>表单内容仅保存在当前浏览器，演示身份不构成真实访问控制。</p></div></div>${restricted?'<div class="u-note">此模块属于妈妈私人空间。请切换至“妈妈”演示身份进行记录。</div>':`<form id="feature-form" data-kind="${e(feature)}">${f.fields.map(fieldHtml).join('')}${shareable.has(feature)?`<label class="u-checkline"><input type="checkbox" name="shared"> 我同意把这条非敏感记录共享给家庭成员（仅演示）</label>`:''}${aiWorkflowKinds.has(feature)?'<label class="u-checkline"><input type="checkbox" name="aiConsent" required> 我同意向 DeepSeek 发送填写信息，并自动保存本次输入和回复（演示版只生成本地模板）</label>':''}<div class="u-actions"><button type="submit" class="u-btn primary">${icon('check',16)} ${feature==='shopping'?'生成商品推荐并保存':aiWorkflowKinds.has(feature)?'提交给 AI 并保存':'保存记录'}</button>${aiWorkflowKinds.has(feature)?btn('查看本功能 AI 历史','ai-history','line',`data-kind="${e(feature)}"`):''}${['care','delegation'].includes(feature)?btn('进入智能排班','go-planner','line'):''}</div></form><div id="template-result" class="u-template-result" hidden></div>`}</div></section><aside><div class="u-panel u-card-pad">${section('已保存的记录',rows.length+' 条可见')}${rows.length?rows.map(recordCard).join(''):'<p class="u-empty">还没有记录，先完成左侧的表单。</p>'}</div><div class="u-rest"><strong>使用提醒</strong><p>${e(helpFor(feature))}</p></div></aside></div>${medicalNote()}`}
function helpFor(kind){return ({recovery:'身体恢复与睡眠差异很大。严重头痛、胸痛、呼吸困难、持续或大量出血请立即就医。',mood:'如果持续情绪低落或出现伤害自己或宝宝的想法，请及时寻求专业或紧急支持。',nutrition:'饮食建议仅供日常参考，个体营养需求应咨询专业医护人员。',feeding:'支持母乳、配方奶和混合喂养，不评判喂养方式。',visit:'只用作就诊问题清单，不进行疾病诊断。',return:'返岗节奏由妈妈根据个人情况和实际支持决定。',parent_ai:'育儿科普不能替代儿科医生。',capsule:'时光胶囊的开启日期只是界面显示限制，不是加密安全措施。',baby_food:'辅食需要考虑月龄、个体发育准备、过敏风险和专业意见。',milestone:'宝宝成长存在个体差异，不用于排名或诊断。',storybook:'生成内容应由家长先阅读，确认适龄。',care:'协作请求不能直接替代真实成员确认。',delegation:'任务须由受邀家人明确同意才能生效。',community:'当前没有公开社区发布及审核机制。',summary:'请先删除讨论中的个人隐私信息。',shopping:'演示仅展示界面示例；云端版通过 DeepSeek 查询公开商品网页，价格库存需在商家核实。'})[kind]||'此功能仅供产品演示使用。'}
function fieldHtml(field){const [name,label,type,a,b]=field;const required=['title','message','item','question','content'].includes(name)?'required':'';let html='';if(type==='textarea')html=`<textarea name="${e(name)}" class="u-textarea" rows="3" placeholder="填写${e(label)}" ${required}></textarea>`;else if(type==='select')html=`<select name="${e(name)}">${String(a||'').split('|').map(v=>`<option value="${e(v)}">${e(v)}</option>`).join('')}</select>`;else html=`<input name="${e(name)}" type="${type}" ${type==='number'?`min="${e(a)}" max="${e(b)}" step="any"`:''} ${type==='date'?'value="'+date()+'"':''} placeholder="请输入${e(label)}" ${required}>`;return `<label class="u-field">${e(label)}${html}</label>`}
function template(kind,data){if(kind==='shopping')return window.MomCareAI.localAnswer(kind,data);if(kind==='storybook')return `本地小故事示例，非 AI 生成：\n\n《森林里的约定》\n\n从前，${data.hero||'小星星'}来到一座森林。在探索中，他遇到了一位需要帮助的新朋友，两人一起克服了一道小难题。傍晚，他们开心地回家，也懂得了${data.value||'珍惜朋友'}。`;
if(kind==='summary')return '本地摘要模板，非 AI 生成：\n1. 整理不同家庭的个人经验。\n2. 标注相互矛盾的意见和证据不足的部分。\n3. 涉及医学知识的说法请查阅权威来源。';
if(kind==='baby_food')return '本地辅食模板，非 AI 生成：\n先确认宝宝已具备适合添加辅食的发育准备，并参考专业建议记录食材及过敏信息。此处没有医学个性化饮食计算。';
if(kind==='visit')return '本地就诊清单模板，非 AI 诊断：\n1. 准备描述症状发生时间和变化。\n2. 列出希望询问的问题。\n3. 记录医生建议与复查计划。';
return '本地关怀建议模板，非 DeepSeek 回复：\n先明确需要什么支持，再与家人沟通可承担的任务、可用时间和休息安排。所有家庭任务仍须成员本人确认。';}
